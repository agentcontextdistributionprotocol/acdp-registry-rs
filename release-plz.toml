[workspace]
changelog_update  = true
# >>> TEMPORARY — BOOTSTRAP ONLY. RESTORE TO `true`. See issue #204. <<<
#
# This flag is OFF for exactly one merge: the release-plz bootstrap merge (#202).
# Changing `git_tag_name` below re-bases release-plz's tag namespace, so the first
# `release` run after that merge mints eight NEW tags at the current main — all of
# them still version 0.1.0, the same version the eight 2026-06-13 tags already
# carry. Left enabled, that run would create eight DUPLICATE public GitHub
# Releases for 0.1.0 and move the repository's "Latest release" marker onto them.
#
# Turning this off suppresses the duplicate Releases WITHOUT suppressing the tags.
# The two are independent: release_plz_core's `create_git_tag_and_release` guards
# the tag on `git_tag.enabled` and the Release on `git_release.enabled` in two
# separate `if` blocks (verified against the 0.3.160 source, and confirmed with
# `release-plz release --dry-run`, which still lists all eight tag creations with
# this set to false).
#
# Once the bootstrap run has landed, set this back to `true`. Leaving it as-is
# silently disables GitHub Releases for this project forever, and the failure is
# invisible: release-plz keeps reporting success and keeps minting tags.
git_release_enable = false
git_tag_enable    = true

# Determine the previous release from git tags, not from crates.io.
# Without this, release-plz looks the crates up on crates.io, finds nothing
# (nothing here is published), treats every crate as a first release, proposes
# the CURRENT version, writes no diff — and then `release` refuses because the
# tag for that version already exists. That deadlock froze this repo at 0.1.0
# from 2026-06-13 to 2026-09-10. Requires release-plz >= 0.3.151.
# https://release-plz.dev/docs/config#the-git_only-field
git_only = true

# NOT a stale TODO: git_only skips `cargo publish` on its own, and this states
# the intent independently. Do NOT flip this flag — doing so would begin
# publishing eight crates to crates.io, a one-way door, and the docs forbid
# enabling it alongside git_only.
#
# (Deliberately phrased without the literal enabled-form of this assignment:
# an acceptance check greps for it, and a comment containing the string is
# indistinguishable from the setting itself to any line-based tool.)
publish = false

# The default template is `{{ package }}-v{{ version }}`, which is the shape of
# the eight dead 2026-06-13 tags. Those tags sit on a commit whose `acdp`
# dependency was a git dependency (and, across the surrounding range, a path
# dependency with a `[patch.crates-io]`), so `cargo package` cannot rebuild it
# and git_only cannot diff against it. Changing the template makes those tags
# stop matching, so release-plz re-bases its own tag namespace at the current
# main on the first run and diffs normally from the second run onward. The old
# tags and their eight GitHub Releases are left untouched.
#
# Changing this again is not a casual edit: every change re-bases the tag
# namespace and re-triggers a one-off bootstrap run that produces no release PR.
git_tag_name = "{{ package }}/v{{ version }}"

[changelog]
header = ""
trim = true
