[graph]
# The Docker image builds `--no-default-features --features "${STORAGE_FEATURE}"`
# with STORAGE_FEATURE defaulting to storage-pg (docker/Dockerfile:16-27), so a
# default-features-only graph would let the entire Postgres subgraph escape the
# advisory/license gate. (REG-7)
all-features = true
no-default-features = false

[advisories]
version = 2
# "deny", and it is enforced rather than aspirational: the graph has zero
# yanked crates, and this setting is what keeps it that way. The two that
# were here — `spin` 0.9.8 and `wnaf` 0.14.0 — were cleared in the same
# change that set this (U-557), which is the ordering the previous version
# of this comment specified and the only one that does not redden `main`.
#
# WHEN THIS FIRES, AND IT WILL, ON A COMMIT THAT CHANGED NOTHING:
# a crate is yanked upstream by its maintainer, with no commit in this repo.
# `cargo-deny` is a REQUIRED status check on `main` (added 2026-09-16), so
# this blocks every merge in the repo until it is cleared. The tool names
# the fix in its own output:
#
#   error[yanked]: detected yanked crate (try `cargo update -p <crate>`)
#
# Run exactly that, one `--package` at a time so each lockfile hunk is
# attributable, and check the successor is in range (a patch bump needs no
# manifest edit; if it does, name the transitive dep that forced it).
#
# Do NOT reach for `ignore` below to get unblocked. It is the path of least
# resistance now that this check blocks, and it converts a solvable lockfile
# problem into a permanent silent exemption — which is the exact failure this
# setting exists to prevent. `ignore` is for an advisory with no upstream fix
# and a written argument for why it cannot reach us (see RUSTSEC-2023-0071
# below). A yanked crate almost always has a successor; that is what yanking
# is for.
yanked = "deny"
ignore = [
    # RUSTSEC-2023-0071 "Marvin" — RSA private-key timing side channel; no
    # upstream patch exists. `rsa` enters the build graph solely because
    # jsonwebtoken 11's `rust_crypto` provider feature enables it
    # unconditionally. Unreachable AND inapplicable, on independent grounds:
    #   1. Every JWT verification pins exactly one algorithm:
    #      `Validation::new(self.material.algorithm())`, HS256 or EdDSA only
    #      (crates/acdp-registry-auth/src/jwt.rs:224). jsonwebtoken 11 rejects
    #      a token whose header `alg` is not in `validation.algorithms`
    #      (InvalidAlgorithm) BEFORE constructing any crypto verifier
    #      (jsonwebtoken-11.0.0 src/decoding.rs:278-280; :282 is the verifier
    #      construction it precedes), so an attacker-supplied `alg: RS256`
    #      executes zero `rsa` code. We use no `jsonwebtoken::jwk` and no RSA
    #      DecodingKey constructors; the DID challenge path whitelists
    #      ed25519/ecdsa-p256 by name before key resolution
    #      (crates/acdp-registry-auth/src/service.rs:149).
    #   2. Marvin recovers an RSA PRIVATE key via timing of private-key
    #      operations. This registry holds no RSA private key material at all
    #      (signing is HS256/EdDSA only) — there is no key to recover.
    # RE-REVIEW (remove or re-justify) if ANY of these change:
    #   - `Validation.algorithms` widens beyond the signer's single algorithm,
    #     or we start verifying third-party-issued JWTs (e.g. federation
    #     peers' tokens against their JWKS);
    #   - any `jsonwebtoken::jwk` / RSA key-import / remote-JWKS path appears;
    #   - sqlx's `mysql` feature (the other latent `rsa` edge) is enabled;
    #   - jsonwebtoken major bump: re-confirm the `alg` allowlist check still
    #     precedes provider/verifier construction in `decode()`.
    { id = "RUSTSEC-2023-0071", reason = "rsa crate unreachable (alg pinned pre-dispatch, decoding.rs:278) and no RSA private key exists to recover; see comment" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    # webpki-roots ships Mozilla's CA bundle under CDLA-Permissive-2.0
    # alongside MPL-2.0. The CDLA-Permissive licenses are non-copyleft
    # data licenses (https://cdla.dev/permissive-2-0/) and are required
    # by rustls-via-aws-lc-rs's webpki-roots dependency.
    "CDLA-Permissive-2.0",
    "CC0-1.0",
    "0BSD",
]
confidence-threshold = 0.9

[bans]
# Deliberately still "warn". Unlike [sources] below, this one is NOT free:
# the graph carries duplicate versions today (base16ct, elliptic-curve and
# friends, largely via jsonwebtoken's p256/p384), so flipping it to "deny"
# would redden the build immediately for a condition that is normal in a
# Rust dependency graph and not itself a security property. Left as a
# signal rather than a gate, on purpose.
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
# "deny" on both, and this costs nothing today: `cargo metadata` reports
# 0 git-sourced dependencies and 0 non-workspace path dependencies, so the
# workspace already satisfies the strict setting. It is a ratchet against a
# future git= or path= dependency slipping in unreviewed, which is exactly
# the case a "warn" on an advisory job would never stop.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
