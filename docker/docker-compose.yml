# OPS-02: every secret-bearing variable is now sourced from a sibling
# `.env` file (or the operator's environment). The `${VAR:-default}`
# substitution keeps the compose file usable for local demos via the
# placeholder defaults. The startup-time validator (see main.rs) rejects
# ACDP_REGISTRY_AUTH__JWT_SECRET set to the literal `changeme` ONLY when
# auth is enabled on HS256 — and config.docker.toml ships
# `auth.enabled = false`, so THIS STACK STARTS CLEANLY WITH THE
# PLACEHOLDER and the check never runs. Generate a real secret with
# `openssl rand -base64 32` before enabling auth or promoting this stack
# beyond a disposable demo.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-acdp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-acdp}
      POSTGRES_DB: ${POSTGRES_DB:-acdp_registry}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-acdp}"]
      interval: 5s
      timeout: 5s
      retries: 5

  registry:
    build:
      # `acdp` comes from crates.io, so the build context is just this repo.
      context: ..
      dockerfile: docker/Dockerfile
      args:
        STORAGE_FEATURE: storage-pg
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ACDP_REGISTRY_CONFIG: /app/config.toml
      ACDP_REGISTRY_STORAGE__POSTGRES_URL: postgres://${POSTGRES_USER:-acdp}:${POSTGRES_PASSWORD:-acdp}@postgres:5432/${POSTGRES_DB:-acdp_registry}
      # NOT validated in this stack: the `changeme` check only runs with
      # auth enabled on HS256, and config.docker.toml disables auth (see
      # the header note). Replace before enabling auth or promoting to
      # anything non-disposable.
      ACDP_REGISTRY_AUTH__JWT_SECRET: ${ACDP_REGISTRY_JWT_SECRET:-changeme}
      RUST_LOG: info,acdp=info,acdp_registry=info
    ports:
      - "8443:8443"
    volumes:
      - ./config.docker.toml:/app/config.toml:ro

volumes:
  pgdata: {}
