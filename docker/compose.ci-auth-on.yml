# CI-only overlay stacked on top of `docker-compose.yml` + `compose.ci.yml`.
#
# Enables auth so CI reaches `validate_config`'s auth-gated branch
# (`crates/acdp-registry-server/src/main.rs:129-142`). The shipped recipe runs
# `auth.enabled = false` (`config.docker.toml`), so without this overlay that
# branch, and the HS256 empty-secret refusal inside it, are never executed by any
# check in this repo's CI.
#
# ── Why this overlay still exists after #271 ──
#
# It used to exist because the recipe had NO env path to enable auth, and adding
# one would have been a security regression. #271 changed half of that: the
# recipe now carries `ACDP_REGISTRY_AUTH__ENABLED: ${ACDP_REGISTRY_AUTH_ENABLED:-}`,
# so an operator can enable auth from the environment.
#
# The security argument is NOT fully retired, and the surviving half is the part
# worth reading. Only the `:-` (empty-default) form is safe. `${VAR:-false}`
# renders the literal string "false", which is NON-empty and therefore still an
# override -- it would force an operator's `auth.enabled = true` back to false.
# Verified with `docker compose config`, not reasoned about. So "adding a
# passthrough" is safe or unsafe depending entirely on its default.
#
# This overlay is kept because it pins auth ON for CI unconditionally, rather
# than depending on the caller's environment reaching compose correctly -- which
# is exactly the failure that made U-509's first auth-on check decorative. It
# remains what it always was: an ADDITIONAL configuration exercised on top of the
# recipe, not the recipe itself. The `--check` run without this overlay is the
# one that speaks for the documented quickstart.
#
# It could now be replaced by setting ACDP_REGISTRY_AUTH_ENABLED=true around the
# `--check-auth-on` invocation. Not done here: docker/assert-quickstart-boots.sh
# is a tracked `*.sh` and therefore lane-3's under the U-508 rule, so changing it
# needs a claim-request rather than a quiet edit.
services:
  registry:
    environment:
      ACDP_REGISTRY_AUTH__ENABLED: "true"
