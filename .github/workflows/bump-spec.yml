name: bump spec

# Delegates to acdp-ci's reusable bump-spec-ref workflow, mirroring bump-acdp.yml.
# Both triggers are live: `workflow_dispatch` for a manual bump, and
# `repository_dispatch` (type `spec-released`) fired by the spec repo when it
# publishes -- that path is what opened the spec bumps this repo has already
# merged.
# Deliberately no consumer list here: the previous version of this comment
# named the spec repo's dispatch matrix and went stale the moment this repo was
# added to it (#139). Another repo's routing table is not this file's to mirror.
on:
  repository_dispatch:
    types: [spec-released]
  workflow_dispatch:
    inputs:
      sha:
        description: 'Spec SHA to adopt (blank = spec HEAD)'
        required: false
        default: ''
jobs:
  bump:
    uses: agentcontextdistributionprotocol/acdp-ci/.github/workflows/bump-spec-ref.yml@v1
    with:
      file: .github/workflows/ci.yml
      sha: ${{ github.event.inputs.sha }}
    secrets:
      ACDP_BOT_APP_ID: '${{ secrets.ACDP_BOT_APP_ID }}'
      ACDP_BOT_PRIVATE_KEY: '${{ secrets.ACDP_BOT_PRIVATE_KEY }}'
