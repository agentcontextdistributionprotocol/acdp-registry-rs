name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

# Superseded pushes to the same PR cancel their in-flight run; pushes to
# main always run to completion so the cache and badge stay trustworthy.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # ── Why a docs gate lives in the rustfmt job (U-516) ──
      #
      # This assertion also runs in `docker.yml`, next to the artifact it
      # describes. That copy REPORTS and cannot block: `docker.yml` publishes the
      # check named `build`, and main's required_status_checks.contexts is exactly
      # ["rustfmt","clippy","tests","conformance (spec fixtures)"] -- `build` is
      # not a member, so a release PR missing its UPGRADING.md section gets a red
      # `build` and a green merge button. No lane and no lanes leader has
      # authority over repo settings, so the fix is to run the same assertion in a
      # job whose check name is ALREADY required, not to ask for a fifth context.
      #
      # `rustfmt` is that job because the gate needs a checkout and nothing else --
      # no feature-set toolchain, no services, no buildx, no registry login --
      # which is this job's entire dependency set too. It is also the fastest
      # required job (~6s), so a missing section reddens in seconds rather than
      # after the ~3min `tests` job, and a bug in this step is diagnosable here
      # instead of being read as a real test failure.
      #
      # ── Why it is FIRST, and why it still carries an `if:` (U-516 AC8) ──
      #
      # A step with no `if:` defaults to `if: success()`, so ANY earlier failing
      # step skips it silently. That is how the docker.yml copy could fail to run
      # at all -- `setup-buildx-action` and `metadata-action` precede it there --
      # leaving "the gate never ran" indistinguishable from "the gate passed".
      # Simply moving it here would have reproduced that: placed after `cargo fmt`,
      # a formatting error would skip the docs gate.
      #
      # Both defences are deliberate, and they cover different things:
      #   - position (immediately after checkout) means nothing that can fail
      #     currently precedes it;
      #   - `if: ${{ !cancelled() }}` means that stays true when someone later
      #     inserts a step above it, which position alone cannot guarantee.
      # `!cancelled()` rather than `always()`: a cancelled run should stop, and
      # `always()` would also fire after a manual cancellation.
      #
      # Consequence accepted: a missing section and a formatting error now both
      # report on the same run, instead of the first hiding the second.
      #
      # The self-test runs BEFORE the assert, matching U-503's ordering: a guard
      # that passes vacuously must be caught before its verdict is trusted. The
      # assert saying "has a section" is only meaningful once the controls have
      # shown the check can still reject one.
      #
      # Keep the `docker.yml` copy: it additionally triggers on the
      # `acdp-registry-server/v*` tag push, which ci.yml never sees. This one
      # blocks the pull request; that one covers the tag.
      - name: self-test the upgrade-notes gate
        if: ${{ !cancelled() }}
        run: bash docker/assert-upgrade-notes.sh --self-test

      - name: assert the version has operator upgrade notes
        if: ${{ !cancelled() }}
        run: bash docker/assert-upgrade-notes.sh --check

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: rustfmt
      - name: cargo fmt
        run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: clippy (sqlite default)
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: clippy (postgres)
        run: |
          cargo clippy --locked -p acdp-registry-server \
            --no-default-features --features storage-pg \
            --all-targets -- -D warnings

      # #265: the clippy steps in this job type-check and lint their feature
      # configurations; they do NOT codegen or link them. Verified directly
      # rather than inferred: with target/debug/acdp-registry removed, a GREEN
      # `cargo clippy --all-targets` for a configuration leaves no binary at all,
      # while `cargo build` for the same configuration produces one (61M). So a
      # clippy step cannot surface a link error for its configuration, because it
      # never links it.
      #
      # Which configurations were actually unlinked, before these steps existed:
      # `storage-pg,playground`, `storage-memory,playground`, no-backend, and
      # `playground` alone were linked by NOTHING. `storage-pg` -- the
      # configuration that ships -- had its binary linked only by docker.yml's
      # image build (STORAGE_FEATURE=storage-pg), i.e. by a different workflow,
      # incidentally; its test step here passes `--test pg_integration`, and this
      # crate is bin-only, so that links a test binary and not the server. The
      # remaining configurations are linked by `cargo test` steps whose features
      # happen to match -- coverage any edit to those steps could remove in
      # silence, which is the same fragility the #221 note below describes.
      #
      # These are ADDITIONS, not replacements. clippy is stronger on lints,
      # build is stronger on codegen and linking; neither subsumes the other.
      # Measured: build is 2-10s per configuration and is usually CHEAPER than
      # the clippy step beside it, and this job is not on the critical path
      # (tests ~2m36s vs clippy ~39s), so PR latency does not move.
      #
      # Each build step must keep its feature list byte-identical to the clippy
      # step above it. Do not rename this job: `clippy` is one of the four
      # contexts in branch protection's required_status_checks, and a required
      # context that stops reporting leaves every PR waiting on a check that
      # never arrives.
      - name: build (postgres)
        run: |
          cargo build --locked -p acdp-registry-server \
            --no-default-features --features storage-pg \
            --all-targets
      - name: clippy (playground)
        run: |
          cargo clippy --locked -p acdp-registry-server \
            --features storage-sqlite,playground \
            --all-targets -- -D warnings
      - name: clippy (memory)
        run: |
          cargo clippy --locked -p acdp-registry-server \
            --no-default-features --features storage-memory \
            --all-targets -- -D warnings

      # The four steps below close #200. Read this before adding a feature.
      #
      # WHY THIS IS ENUMERATED AND NOT `--all-features`: it can never pass here.
      # `--all-features` turns on all three storage backends at once, and the
      # guard at crates/acdp-registry-server/src/main.rs:45-54 `compile_error!`s
      # on any PAIR of them, because `run()` selects the backend via cfg gates
      # that assume exactly one is live. That guard is correct and stays; the
      # cost is that the feature space can only be covered by writing it out,
      # and a written-out list goes stale silently. It already did once — these
      # four configurations were valid and unbuilt for the whole of #195.
      #
      # THIS BINARY'S SPACE IS EIGHT, and the arithmetic keeps the list honest:
      # 4 backend states (sqlite | pg | memory | none) x playground on/off = 8.
      # Check the count against the arithmetic rather than trusting the list.
      #
      #   1 sqlite                 default workspace step above
      #   2 pg                     step above
      #   3 memory                 step above
      #   4 sqlite,playground      step above
      #   5 pg,playground          below
      #   6 memory,playground      below
      #   7 none                   below
      #   8 playground (no backend) below
      #
      # Scope note: this is acdp-registry-server's feature space, NOT the
      # workspace's. `acdp-registry-types` has its own `default = ["axum"]` /
      # `axum` pair whose no-default-features build is a supported consumer
      # scenario.
      #
      # This note used to end "#200 assumed it was 'covered incidentally'; it
      # is not." That was wrong, and #200 was right. Measured:
      # acdp-registry-pg declares the dependency `default-features = false`
      # (crates/acdp-registry-pg/Cargo.toml:16), and `cargo tree -p
      # acdp-registry-pg -f '{p} {f}'` shows acdp-registry-types with an EMPTY
      # feature set, against `axum,default` when resolved for
      # acdp-registry-server. So the `cargo test -p acdp-registry-pg` step in
      # the test job already compiles it at feat=[] under -D warnings.
      #
      # It is a -p build, which matters: `cargo test --workspace` unifies
      # features and would resolve axum,default instead. The incidental
      # coverage therefore hangs on that one step keeping its -p form.
      # #221 is closed by making it deliberate (see the types steps below),
      # not by adding coverage that did not exist.
      #
      # 7 and 8 are the inert builds: with no storage backend, `run()` bails
      # naming which feature to rebuild with, so the whole serve path is
      # unreachable. main.rs allows dead_code for exactly that configuration --
      # see the comment there. Both were warning-dirty and would have failed
      # these steps before that change. Step 7 is proved to redden in CI, in the
      # PR that added these steps; step 8 fails on the identical cause and was
      # proved locally, because a job aborts at its first failing step, so only
      # one of the two can be shown red in any single run.
      #
      # WHAT 7 AND 8 DO NOT COVER: four integration-test files are gated to a
      # backend at file level (http_integration.rs, conformance.rs,
      # metrics_integration.rs on storage-sqlite; pg_integration.rs on
      # storage-pg) and compile to empty harnesses. Measured: 7 test
      # executables build and 71 tests run, essentially all from main.rs's
      # inline module plus anchors_uri_never_dereferenced.rs and
      # conformance_gate.rs, which are ungated. These steps are a compile gate
      # on the binary, not test coverage.
      #
      # EDITING HAZARD, worth more than it looks. Both mutations below were
      # measured, but they answer two different questions, so note the baseline
      # each is measured against -- conflating them gets the answer backwards.
      #
      # Dropping `--no-default-features` -- measured against the regression
      # these steps exist to catch (main.rs's allow removed), because with a
      # clean tree there is nothing for the mutated step to miss:
      #   * Steps 7 and 8 -> still PASS. Each degenerates into the default
      #     sqlite build: a green duplicate of the first step, covering nothing.
      #     Silent, and it is the row that matters that fails this way.
      #   * Steps 5 and 6 -> fail loudly (the pair guard above fires). That is
      #     the only flag mistake anything here catches for you.
      #
      # Dropping `--all-targets` -- a property of the tree as shipped: all four
      # steps still PASS, having silently stopped checking the test target. What
      # is lost is future coverage, not present: the 2 items the test target
      # reports today are a strict SUBSET of the bin target's 7, so nothing is
      # unguarded right now -- but a dead item that appears only in the test
      # target would go unchecked, and nothing would say so.
      #
      # Three of those four mistakes are silent. Keep these command lines
      # exact.
      - name: clippy (postgres + playground)
        run: |
          cargo clippy --locked -p acdp-registry-server \
            --no-default-features --features storage-pg,playground \
            --all-targets -- -D warnings
      - name: build (postgres + playground)
        run: |
          cargo build --locked -p acdp-registry-server \
            --no-default-features --features storage-pg,playground \
            --all-targets
      - name: clippy (memory + playground)
        run: |
          cargo clippy --locked -p acdp-registry-server \
            --no-default-features --features storage-memory,playground \
            --all-targets -- -D warnings
      - name: build (memory + playground)
        run: |
          cargo build --locked -p acdp-registry-server \
            --no-default-features --features storage-memory,playground \
            --all-targets
      - name: clippy (no storage backend)
        run: |
          cargo clippy --locked -p acdp-registry-server \
            --no-default-features \
            --all-targets -- -D warnings
      - name: build (no storage backend)
        run: |
          cargo build --locked -p acdp-registry-server \
            --no-default-features \
            --all-targets
      - name: clippy (playground, no storage backend)
        run: |
          cargo clippy --locked -p acdp-registry-server \
            --no-default-features --features playground \
            --all-targets -- -D warnings
      - name: build (playground, no storage backend)
        run: |
          cargo build --locked -p acdp-registry-server \
            --no-default-features --features playground \
            --all-targets

      # Closes #221. `acdp-registry-types` has its own default = ["axum"]
      # feature pair, and its no-default build is a supported consumer
      # scenario that the eight steps above do NOT cover — they enumerate
      # acdp-registry-server's feature space, not the workspace's.
      #
      # CORRECTION worth stating, because #221 does not say it: that
      # configuration is ALREADY compiled at feat=[] today, incidentally, by
      # `cargo test -p acdp-registry-pg` (the test job) — acdp-registry-pg
      # depends on acdp-registry-types without default features, confirmed
      # with `cargo tree -f '{p} {f}'`. So this step does not close a hole in
      # what is built; it makes the coverage DELIBERATE instead of a
      # side effect that any dependency edit could silently remove. Said
      # plainly so nobody "discovers" the incidental build mid-review and
      # concludes the step is redundant.
      - name: clippy (types, no default features)
        run: |
          cargo clippy --locked -p acdp-registry-types \
            --no-default-features --all-targets -- -D warnings

  # The workspace declares rust-version = 1.88; make that claim enforceable
  # instead of aspirational. Checks both shipped storage backends.
  msrv:
    name: msrv (1.88)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: cargo check (sqlite default)
        run: cargo check --locked --workspace --all-targets
      - name: cargo check (postgres)
        run: |
          cargo check --locked -p acdp-registry-server \
            --no-default-features --features storage-pg \
            --all-targets

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: cargo doc
        run: cargo doc --locked --workspace --no-deps

  test:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: acdp
          POSTGRES_PASSWORD: acdp
          POSTGRES_DB: acdp_registry
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U acdp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: cargo test (sqlite)
        run: cargo test --locked --workspace
      - name: cargo test (playground)
        run: |
          cargo test --locked -p acdp-registry-server \
            --features storage-sqlite,playground
      - name: cargo test (postgres)
        env:
          ACDP_REGISTRY_TEST_PG_URL: postgres://acdp:acdp@localhost:5432/acdp_registry
          ACDP_REQUIRE_PG: "1"
        run: |
          cargo test --locked -p acdp-registry-pg
          cargo test --locked -p acdp-registry-server \
            --no-default-features --features storage-pg \
            --test pg_integration
      # #216 / H-F: `#[ignore]` written ABOVE `#[test]` de-registers a test while
      # leaving it textually intact, so `conformance.rs`'s own text guards see a
      # present, attribute-wearing function and pass. Measured: the test reports
      # `ignored`, 68 tests become 67 executed, and both guards stay green.
      #
      # This asks the TEST HARNESS rather than the source: `--ignored --list`
      # enumerates what the compiled binary actually marked as ignored. That is
      # mechanism output, so no comment or string literal can satisfy it, and it
      # needs no list of test names to compare against.
      #
      # No conformance test may be ignored AT ALL. That is deliberately stricter
      # than "no registered test may be ignored": it needs no name list, and a
      # genuine need to ignore one has to edit this step, which is visible in
      # review. The conformance suite is a spec-obligation ratchet; a silently
      # skipped obligation is the failure mode it exists to prevent.
      - name: conformance suite has no ignored tests (#216 — the #[ignore] defeat)
        run: |
          set -euo pipefail
          out="$(cargo test --locked -p acdp-registry-server \
                   --features storage-sqlite,playground \
                   --test conformance -- --ignored --list)"
          echo "$out"
          # Find the summary line FIRST and fail if it is absent: a build failure
          # or a changed libtest output format must not read as "zero ignored".
          summary="$(printf '%s\n' "$out" | grep -E '^[0-9]+ tests?, [0-9]+ benchmark' || true)"
          if [ -z "$summary" ]; then
            echo "::error::could not find libtest's summary line in the output above;" \
                 "this check cannot conclude anything, so it fails rather than passing"
            exit 1
          fi
          count="$(printf '%s\n' "$summary" | grep -oE '^[0-9]+')"
          if [ "$count" -ne 0 ]; then
            echo "::error::$count conformance test(s) are #[ignore]d. A conformance" \
                 "test that never runs still satisfies the file's own text guards," \
                 "so the spec obligation silently stops being checked. Un-ignore it," \
                 "or delete it and update COVERED/PARTIAL_DIRECT."
            exit 1
          fi
      # NAME IS DELIBERATELY NARROW. This step does NOT test the memory
      # storage backend, and the old name ("cargo test (memory)") implied it
      # did. Measured: under these flags all four integration files are
      # cfg-gated away and report 0 tests each (conformance, http_integration,
      # metrics_integration, pg_integration). What runs is 71 tests — config
      # validation from main.rs's inline module, plus two workspace scans —
      # none of which touch MemoryStore.
      #
      # This is STRUCTURAL, not an oversight anyone can close here.
      # `acdp-registry-server` is bin-only ([[bin]], no [lib]) and
      # `MemoryStore` lives in src/memory_ext.rs, a module of that binary.
      # Integration tests compile as separate crates and link only against a
      # lib target, so no tests/*.rs file can reach it — verified, not
      # assumed: a probe importing it fails with
      #   error[E0433]: unresolved module or unlinked crate `acdp_registry_server`
      # Adding a tests/memory_smoke.rs therefore CANNOT work without
      # restructuring the crate. The only route to covering MemoryStore is a
      # #[cfg(test)] mod tests inside memory_ext.rs itself, which has none.
      #
      # Renamed rather than fixed, on purpose: leaving an accurate name is
      # better than leaving an inaccurate one while the real fix is out of
      # scope. A `MemoryStore::get` that always returned Ok(None) would still
      # pass this step.
      - name: cargo test (memory build; storage backend NOT covered)
        run: |
          cargo test --locked -p acdp-registry-server \
            --no-default-features --features storage-memory
      # #221's other half: run the types crate's own tests at feat=[], not
      # just compile it there. Its no-default build is a supported consumer
      # configuration (see the clippy job's note on the incidental coverage
      # that already exists via acdp-registry-pg).
      - name: cargo test (types, no default features)
        run: |
          cargo test --locked -p acdp-registry-types \
            --no-default-features

      # The README's quick-start points a new user at
      # config/registry.example.toml. That file REFUSED TO BOOT: it sets
      # auth.enabled = true with an empty jwt_secret and
      # allow_ephemeral_secret = false, which is exactly what
      # crates/acdp-registry-server/src/main.rs bails on. Nothing caught it,
      # because nothing ever booted the shipped example.
      #
      # This step boots it the way the README now documents and asserts the
      # server actually answers. It is the durable half of that fix: without
      # it, the example regresses the next time someone edits it and the
      # quick-start silently stops working again.
      #
      # Deliberately uses the SHIPPED file rather than a fixture — a smoke
      # test against a copy would prove nothing about what users are handed.
      - name: smoke (the README quick-start actually boots)
        run: |
          set -euo pipefail
          cargo build --locked -p acdp-registry-server
          ACDP_REGISTRY_CONFIG=config/registry.example.toml \
          ACDP_REGISTRY_AUTH__JWT_SECRET="$(openssl rand -base64 32)" \
          ACDP_REGISTRY_REGISTRY__PORT=8899 \
            ./target/debug/acdp-registry & SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:8899/healthz" >/dev/null 2>&1; then break; fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "::error::the shipped config/registry.example.toml did not boot -- the README quick-start is broken"
              wait "$SERVER_PID" || true
              exit 1
            fi
            sleep 1
          done
          BODY="$(curl -fsS "http://127.0.0.1:8899/healthz")"
          echo "healthz: $BODY"
          echo "$BODY" | grep -q '"status":"ok"' \
            || { echo "::error::/healthz did not report ok: $BODY"; exit 1; }

  # Runs the spec conformance suite against a SHA-pinned spec checkout.
  # ACDP_REQUIRE_CONFORMANCE turns a missing spec into a hard failure, so
  # a green run genuinely proves the fixtures executed rather than that
  # the suite silently skipped them (REG-1).
  #
  # A wrongdir ACDP_SPEC_DIR -- the spec's fixtures directory instead of
  # its root -- IS caught, but this comment used to credit the wrong
  # mechanism. It named the KNOWN_FAMILIES/EXCUSED ratchets as the
  # mitigation; measured, four of them SKIPPED silently under full
  # require-mode and the run was failed by an unrelated read_json panic in
  # registry_advertisable_profiles_matches_spec_derived_set. spec_families()
  # now asserts under require-mode, so those four fail on their own names,
  # and that fifth test keeps an independent check of its own. Two paths,
  # deliberately not shared.
  #
  # ACDP_SPEC_DIR below is therefore the spec *root* (where
  # registries/profiles.json lives), not schemas/conformance.
  conformance:
    name: conformance (spec fixtures)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Our own checkout MUST stay ahead of checkout-spec: actions/checkout
      # cleans its destination, so running it second would wipe the spec tree.
      # It must also stay ahead of the LOCAL action below, which reads a file
      # out of this repository.
      - uses: actions/checkout@v7
      # THE PIN IS NOT DECLARED HERE. It lives in `.spec-pin` at the repo root,
      # the single declarative source, which `mutants.yml` and the conformance
      # harness itself also read -- `spec_root()` in
      # crates/acdp-registry-server/tests/conformance.rs now REFUSES an
      # ACDP_SPEC_DIR tree that is not at the pin, instead of silently measuring
      # against whatever the operator happened to have checked out (U-536).
      #
      # `bump-spec.yml` points the spec bumper at `.spec-pin`, so this file no
      # longer needs to hold a bumpable sha. Do NOT re-point that bumper here:
      # its matcher would find no `ref:`+sha below the `checkout-spec@` anchor
      # and would read `dtolnay/rust-toolchain`'s own action pin as the current
      # spec ref. Measured -- the rewrite then lands nowhere and the bumper
      # fails on its own post-rewrite assertion, so it is loud rather than
      # destructive, but it is still wrong.
      #
      # `spec_pin_violations` (tests/conformance_gate.rs) asserts on every PR
      # that this file restates no spec sha and does use the shared reader.
      - name: Read the pinned spec revision
        id: pin
        uses: ./.github/actions/read-spec-pin
      - name: Check out the ACDP spec
        id: spec
        uses: agentcontextdistributionprotocol/acdp-ci/actions/checkout-spec@015910153b61c32abbe018afe85d44868897bf3b # v1
        with:
          # `repository:` is passed through from the pin file rather than left
          # to this action's own default, which it currently matches. If the two
          # ever diverged, the bumper would resolve a sha from the repository
          # `.spec-pin` names while this job checked out a different one -- a
          # silent wrong-tree pass. One source feeding both closes that.
          repository: ${{ steps.pin.outputs.repository }}
          ref: ${{ steps.pin.outputs.ref }}
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Conformance (spec fixtures required)
        # checkout-spec already exports both of these to $GITHUB_ENV. They are
        # restated here so require-mode remains a property of THIS file: an
        # invocation carrying `require-conformance: false` would otherwise
        # downgrade a broken spec checkout from a hard failure to a silently
        # green skip. ACDP_SPEC_DIR is taken from the action's `path` output
        # rather than a second hardcoded path, so the two cannot drift.
        env:
          ACDP_SPEC_DIR: ${{ steps.spec.outputs.path }}
          ACDP_REQUIRE_CONFORMANCE: "1"
        run: |
          cargo test --locked -p acdp-registry-server \
            --features storage-sqlite,playground \
            --test conformance --test conformance_gate -- --nocapture

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: acdp
          POSTGRES_PASSWORD: acdp
          POSTGRES_DB: acdp_registry
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U acdp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          tool: cargo-llvm-cov
      # --fail-under-lines is the whole point: without a floor this job could
      # only ever ratchet DOWN invisibly, since it renders a summary and
      # uploads lcov but asserted nothing about either.
      #
      # 75 is deliberately conservative rather than "just under current".
      # Measured locally at 79.91% line coverage (79.42% region, 71.67%
      # function) — but that run had no Postgres, so the pg tests skipped and
      # CI's number will be HIGHER than the one this floor was derived from.
      # Setting the floor at the local figure would therefore have been
      # tightening against the wrong baseline. Re-tighten once a real CI
      # number has been observed on a few runs.
      #
      # Honest scope: this makes the coverage JOB fail below the floor. It
      # does not block a merge, because `coverage` is not a required status
      # check (that is a repo setting, raised separately). A floor on an
      # advisory job is a signal, not a gate.
      - name: cargo llvm-cov
        env:
          ACDP_REGISTRY_TEST_PG_URL: postgres://acdp:acdp@localhost:5432/acdp_registry
          ACDP_REQUIRE_PG: "1"
        run: |
          cargo llvm-cov --locked --workspace --lcov --output-path lcov.info \
            --fail-under-lines 75
      - name: coverage summary
        run: |
          # One append of one block, rather than four opens of the same file.
          {
            echo '## Coverage'
            echo '```'
            cargo llvm-cov report --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: lcov
          path: lcov.info

  audit:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          arguments: --workspace
