# CI drift-detection for transcribed protection lists (U-562).
#
# WHY THIS EXISTS. U-559 (#325) deleted every stale copy of main's branch-protection
# required_status_checks.contexts from comments in ci.yml, lint.yml,
# assert-upgrade-notes.sh and conformance.rs -- each had drifted from the live setting
# before, and a stale comment is worse than none. Every copy was replaced with an
# instruction to read the setting live via `gh api .../protection`.
#
# U-559 fixed today's staleness but installed no automation to keep it fixed -- its own
# report said so explicitly. This job is that automation: it reads the live setting on a
# schedule and fails the moment it stops matching the committed baseline in
# .github/required-checks.json, so the assumption those four files' logic depends on (that
# these specific contexts gate `main`) gets caught the same day it changes, not discovered by
# a stale comment weeks later.
#
# THE BASELINE FILE. It used to be an inline `expected=` list in this file -- the only copy,
# and unvalidated: nothing noticed if a name in it no longer matched any job. It is now
# .github/required-checks.json, which lint.yml's required-checks guard validates on every
# PR (each name resolves to a PR-triggered, unskippable job; each entry pins app_id), so a
# job rename goes red in the PR that does it, and this job compares the live setting to the
# same file. Comparison is on `.checks` -- context AND app_id -- plus `strict`, not the
# bare `.contexts` list: an unpinned context is satisfied by ANY app with statuses:write,
# and `strict=false` would quietly let stale-base PRs merge; neither shows in `.contexts`.
#
# NOT ON pull_request. Branch protection changes through the GitHub UI, not through a PR
# to this repo, so a PR-triggered run has nothing to catch here -- a scheduled ratchet is
# the right shape, same reasoning as mutants.yml.
#
# THE TOKEN. Reading /branches/{branch}/protection is a repository-administration read.
# That permission does not exist as a GITHUB_TOKEN workflow-permission key at all -- it's
# App/PAT-only -- so the default token could never do this no matter what the
# `permissions:` block below says. acdp-deps-bot already authenticates other workflows in
# this repo (bump-acdp.yml, bump-spec.yml, notify-website.yml, release-plz.yml) via the
# ACDP_BOT_APP_ID / ACDP_BOT_PRIVATE_KEY org secrets; its installation was granted
# `administration: read` for this unit (2026-09-21) rather than minting a new PAT, so
# there is one fewer credential to rotate.
#
# The minted token is narrowed with explicit `permission-*` inputs to exactly what this job
# reads (administration:read for /protection, metadata:read for the repo itself). Without
# them it inherits EVERY permission the installation holds -- including the bot's
# `contents: write` -- for a job that only ever reads.
name: branch-protection-drift

on:
  schedule:
    # 05:23 UTC daily. Off the hour, and offset from mutants.yml's Monday 05:17 so the
    # two scheduled jobs don't queue at the same instant.
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-drift:
    runs-on: ubuntu-latest
    steps:
      # The baseline lives in the repo (.github/required-checks.json), so this job needs the
      # tree. No credentials persisted: nothing here pushes.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Mint token for branch-protection read
        id: app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.ACDP_BOT_APP_ID }}
          private-key: ${{ secrets.ACDP_BOT_PRIVATE_KEY }}
          owner: agentcontextdistributionprotocol
          repositories: acdp-registry-rs
          permission-administration: read
          permission-metadata: read

      - name: Compare live required checks against .github/required-checks.json
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail

          # Both sides normalised to {strict, checks: [{context, app_id}] sorted by context},
          # printed with SORTED KEYS (-S): `gh --jq` (gojq) emits object keys sorted while jq
          # keeps insertion order, so without -S identical settings compare unequal -- found
          # by running this against the live setting. Array order does not matter; app_id does.
          expected="$(jq -cS '{strict, checks: (.required | map({context, app_id}) | sort_by(.context))}' \
            .github/required-checks.json)"
          actual="$(gh api "repos/${GITHUB_REPOSITORY}/branches/main/protection" \
            --jq '.required_status_checks | {strict, checks: (.checks | map({context, app_id}) | sort_by(.context))}')"
          actual="$(printf '%s' "$actual" | jq -cS .)"

          if [ "$actual" != "$expected" ]; then
            echo "::error::main's required status checks (context + app_id) or strict flag drifted from .github/required-checks.json."
            echo "  expected: $expected"
            echo "  actual:   $actual"
            echo
            echo "If the live setting is right, update .github/required-checks.json in a PR"
            echo "(lint's required-checks guard validates every name). If the file is right,"
            echo "restore the setting -- pinned, read-modify-write, never POST .../contexts:"
            echo "  jq '{strict, checks: .required}' .github/required-checks.json \\"
            echo "    | gh api --method PATCH repos/${GITHUB_REPOSITORY}/branches/main/protection/required_status_checks --input -"
            exit 1
          fi

          echo "required_status_checks unchanged: $actual"
