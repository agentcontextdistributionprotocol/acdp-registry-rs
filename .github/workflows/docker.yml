name: docker

on:
  push:
    branches: [main]
    # release-plz tags every crate in the workspace at the same commit, so a
    # release produces eight tags at once. Only the server crate's tag denotes a
    # *server* release — docker/Dockerfile builds the `acdp-registry` binary from
    # crates/acdp-registry-server — and matching only it keeps this workflow to
    # one run per release. A broader `*-v*` would fire eight concurrent builds
    # racing on the same image tag; `concurrency: docker-${{ github.ref }}` would
    # NOT serialise them, because each tag is a different ref.
    #
    # The previous value here was `v*`, which never matched anything: no tag of
    # that shape has ever existed in this repo, so this trigger had never fired
    # and the semver rule below was dead. Keep this in step with
    # release-plz.toml's `git_tag_name`.
    tags: ["acdp-registry-server/v*"]
  pull_request:
    branches: [main]

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/acdp-registry

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ env.IMAGE }}
          # `latest` must come only from the default-branch rule below. The
          # `latest=auto` default would additionally attach it to release tags,
          # silently moving what `:latest` points at — and docker/RAILWAY.md
          # tells operators to deploy `:latest`.
          flavor: latest=false
          # `match=` on the two semver rules is required: these tags are
          # `acdp-registry-server/v1.2.3`, not a bare `v1.2.3`, and type=semver
          # cannot parse the prefixed form on its own. Without it the rule does
          # not match, metadata-action emits only a warning, and `version`
          # silently falls through to `sha-...` (semver priority 900, sha 100).
          # The assert step below exists because that failure is otherwise
          # invisible in a green job.
          #
          # `type=sha` is gated on `{{is_default_branch}}` — the SAME gate as
          # `latest` below — so the three main-line tags (`main`, `latest`,
          # `sha-<short>`) have exactly one writer: the default-branch push.
          # Without that gate the rule fired on the tag-triggered run too, and
          # since release-plz tags the commit it merges (release-plz.toml's
          # `git_tag_name`), one commit got two publishing runs that both pushed
          # `sha-<short>`. On v0.1.3 (f8b6d9e) run 34734028111 published
          # sha-f8b6d9e -> sha256:b9315cc84f08 at 02:52:16Z and run 34734871991
          # re-pointed it to sha256:cf2f85068eb6 at 03:12:00Z — a tag that reads
          # as content-addressed moving 19m44s after it was published. The two
          # digests are NOT a reproducibility bug and must not be "fixed" by
          # collapsing the builds: metadata-action stamps
          # `org.opencontainers.image.version` (`main` vs `0.1.3`) and buildx
          # attaches per-run provenance, so the release image is a deliberately
          # different artifact that carries its own release identity.
          # `assert image tags` below enforces the invariant as an iff, which is
          # what makes deleting this gate fail on the PR that deletes it.
          #
          # These comments sit ABOVE `tags:` deliberately. `tags:` is a block
          # scalar, so anything indented under it is literal INPUT, not a YAML
          # comment — a `#` line there only survives because metadata-action's
          # CSV parser happens to be configured to strip `#`, which its README
          # does not document. Relying on that would mean a future version of
          # the action silently reinterpreting six comments as six malformed
          # tag rules. Keep prose out of the block scalar.
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}},match=v(\d+\.\d+\.\d+.*)$
            type=semver,pattern={{major}}.{{minor}},match=v(\d+\.\d+\.\d+.*)$
            type=sha,enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}

      # A green job is not evidence that the tag rules fired. Make it evidence.
      - name: assert semver tag on a release tag push
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          v='${{ steps.meta.outputs.version }}'
          case "$v" in
            [0-9]*.[0-9]*.[0-9]*) echo "metadata version '$v' is semver" ;;
            *) echo "::error::metadata-action produced version '$v' for ${{ github.ref }}; the type=semver match= rule did not fire"; exit 1 ;;
          esac

      # #276: release notes are generated from commit SUBJECTS, which cannot
      # carry "upgrade these two things together or the stack will not boot".
      # docs/UPGRADING.md is the named place operator-visible changes travel, and
      # this is what stops that being a convention with nothing behind it: the
      # version this image will carry must have a section there, even if that
      # section says nothing changed.
      #
      # Here rather than in ci.yml because this workflow builds the operator-facing
      # artifact -- same audience, same moment -- and because it runs on
      # pull_request, so the release PR (where the version bump actually happens)
      # is gated before it merges.
      # This copy REPORTS; it does not block. `build` is not in main's
      # required_status_checks.contexts, so a failure here leaves the merge
      # button green. The blocking copy is in ci.yml's `fmt` job, whose check
      # name `rustfmt` IS required -- see the rationale there (U-516). This copy
      # is kept because docker.yml also runs on the `acdp-registry-server/v*` tag
      # push, which ci.yml never sees.
      - name: assert the version has operator upgrade notes
        if: ${{ !cancelled() }}
        run: bash docker/assert-upgrade-notes.sh --check

      - name: self-test the upgrade-notes gate
        if: ${{ !cancelled() }}
        run: bash docker/assert-upgrade-notes.sh --self-test

      # The guard's own falsification, re-run on every event instead of being
      # asserted once in a PR body. Several of its cases assert that the guard
      # REJECTS, two of them replaying the real tag sets from the runs named in
      # the `tags:` comment above. This is NOT redundant with the shellcheck in
      # lint.yml, and both are kept deliberately: shellcheck proves the script is
      # well-formed shell, this proves its logic still rejects the real incident
      # data. Neither implies the other — the last-token bug that made the guard
      # pass the very release it was written to reject was perfectly well-formed.
      - name: self-test the image-tag guard
        run: bash docker/assert-image-tags.sh --self-test

      # Assert the one-writer invariant BEFORE anything is published, so a bad
      # tag set blocks the push rather than being discovered in the registry
      # afterwards — the original defect survived two green runs precisely
      # because nothing checked the computed tags against the ref that produced
      # them. Runs on every event, including pull requests: that is what makes
      # deleting the `enable={{is_default_branch}}` gate fail on the PR that
      # deletes it, instead of at the next release.
      #
      # `steps.meta.outputs.tags` rather than `.outputs.json`: it is the exact
      # value handed to build-push-action below, so this asserts on what is
      # actually pushed. It is multi-line, hence the env var.
      - name: assert image tags
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          bash docker/assert-image-tags.sh --check \
            --tags "$TAGS" \
            --event '${{ github.event_name }}' \
            --ref '${{ github.ref }}' \
            --default-branch '${{ github.event.repository.default_branch }}'

      # `option_env!("ACDP_BUILD_SHA")` is compiled into the binary, so the
      # commit has to arrive as a build ARG (`.dockerignore` excludes `.git/`).
      # Truncated here rather than in Rust so the served version reads
      # `<version>+g<shortsha>`; GitHub expressions have no substring
      # function, so this needs its own step.
      - name: short sha
        id: sha
        run: echo "short=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      # Build the image first and load it into the local daemon so it can be
      # smoke-tested before anything is published. The push below reuses this
      # build via the buildx cache.
      - name: build (amd64, local)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile
          load: true
          platforms: linux/amd64
          tags: acdp-registry:smoke
          build-args: |
            STORAGE_FEATURE=storage-pg
            ACDP_BUILD_SHA=${{ steps.sha.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: smoke test
        run: |
          set -euxo pipefail
          docker network create acdp-smoke
          docker run -d --name pg --network acdp-smoke \
            -e POSTGRES_USER=acdp -e POSTGRES_PASSWORD=acdp -e POSTGRES_DB=acdp_registry \
            --health-cmd "pg_isready -U acdp" --health-interval 2s --health-retries 15 \
            postgres:16-alpine
          for _ in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' pg)" = healthy ] && break
            sleep 2
          done
          docker run -d --name registry --network acdp-smoke -p 8443:8443 \
            -v "$PWD/docker/config.docker.toml:/app/config.toml:ro" \
            -e ACDP_REGISTRY_CONFIG=/app/config.toml \
            -e ACDP_REGISTRY_STORAGE__POSTGRES_URL=postgres://acdp:acdp@pg:5432/acdp_registry \
            acdp-registry:smoke
          # Write OUTSIDE the repo: $PWD is the `context: .` of both build
          # steps, and .dockerignore does not exclude this file. A stray file
          # here changes the `COPY . .` layer hash, so the build+push step
          # below would miss the buildx cache and recompile the whole release
          # workspace on every push.
          curl --fail --silent --show-error --retry 15 --retry-delay 2 --retry-all-errors \
            http://localhost:8443/healthz -o "$RUNNER_TEMP/healthz.json"
          cat "$RUNNER_TEMP/healthz.json"
          # Dump logs BEFORE the assertion below, so a failing version check
          # still leaves the container's logs in the job output.
          docker logs registry
          # #117: prove the running image reports the commit it was built from.
          # Asserting the shape, not a literal version, so a package-version
          # bump does not break this.
          VERSION="$(jq -r .version "$RUNNER_TEMP/healthz.json")"
          case "$VERSION" in
            *"+g${{ steps.sha.outputs.short }}")
              echo "healthz version '$VERSION' carries the build commit" ;;
            *)
              echo "ERROR: healthz version '$VERSION' does not carry +g${{ steps.sha.outputs.short }}"
              exit 1 ;;
          esac
          docker rm -f registry pg
          docker network rm acdp-smoke

      # ── #266: the DOCUMENTED recipe, not a reimplementation of it ──────────
      #
      # The smoke test above hand-rolls `docker run` and mounts
      # `docker/config.docker.toml` directly, so it never opens
      # `docker/docker-compose.yml`. But `cd docker && docker compose up --build`
      # is what README.md's "Production (Postgres + Docker)" section tells
      # operators to run, and the compose file carries its own environment block
      # -- including `ACDP_REGISTRY_AUTH__JWT_SECRET`.
      #
      # That distinction is the whole reason these steps exist. W3-U5 happened
      # because the compose file shipped `ACDP_REGISTRY_AUTH__JWT_SECRET=changeme`;
      # `validate_config` rejects that placeholder by name
      # (`crates/acdp-registry-server/src/main.rs:166`), so the quickstart exited
      # rc=1 before serving a request. The defect lived in the one file CI never
      # read, which is why a user hit it before CI did. Fixed in `abfebf7` with
      # nothing guarding it since.
      #
      # `compose.ci.yml` points the service at the image built above instead of
      # rebuilding the release workspace a second time. It overrides ONLY the
      # build/image keys -- the environment block, the config mount, the postgres
      # wiring and `depends_on` are all the recipe's own, because those are what
      # is under test.
      - name: the documented quickstart boots
        run: bash docker/assert-quickstart-boots.sh --check

      # The shipped recipe runs `auth.enabled = false`, so the step above
      # exercises neither `validate_config`'s auth-gated branch (main.rs:108)
      # nor the HS256 empty-secret refusal beside it. Boot it again the way the
      # compose file's own header documents overriding the secret.
      #
      # The secret is generated HERE rather than inside the script so that the
      # literal check from #266 -- `grep -n "jwt_secret\|JWT_SECRET"
      # .github/workflows/docker.yml` -- lands on real configuration a reader can
      # follow, not only on the prose above it. That grep is what a future reader
      # will re-run to ask whether this gap ever got closed.
      - name: the documented quickstart boots with auth enabled
        run: |
          set -euo pipefail
          ACDP_REGISTRY_JWT_SECRET="$(openssl rand -base64 32)" \
            bash docker/assert-quickstart-boots.sh --check-auth-on

      # The falsification, wired in rather than asserted once in a PR body --
      # same convention as `self-test the image-tag guard` above. Both cases
      # assert the stack REFUSES: one replays the literal W3-U5 `changeme`
      # placeholder, the other turns auth on with no secret. A boot check that
      # has never failed is not yet a check.
      - name: self-test the quickstart boot guard
        run: bash docker/assert-quickstart-boots.sh --self-test

      # PRs stop at the smoke test above; only pushes and tags publish.
      - name: build + push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            STORAGE_FEATURE=storage-pg
            ACDP_BUILD_SHA=${{ steps.sha.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
