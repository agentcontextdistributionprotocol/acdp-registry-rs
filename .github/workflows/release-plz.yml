name: release-plz

on:
  push:
    branches:
      - main

permissions:
  pull-requests: write
  contents: write

# Never run two release-plz invocations concurrently — overlapping runs can
# race on the release PR and on publishing. Queue instead of cancel.
concurrency:
  group: release-plz

jobs:
  release-plz:
    runs-on: ubuntu-latest
    # git_only re-derives each package from `cargo package` at candidate commits
    # instead of downloading one tarball from crates.io. Measured at 10.7 min for
    # eight crates — but that was macOS/Apple Silicon with a warm ~/.cargo. This
    # runner is a slower 4-core box with a cold registry and no cargo cache step,
    # so budget 25-35 min. Bounded at 45 rather than 60 deliberately: the App
    # token minted below lives exactly 60 minutes, so a 60-minute job bound
    # leaves no margin and a long run would die on an opaque 401 instead of a
    # clean timeout. 45 still clears the 25-35 budget.
    # Note the *bootstrap* run is the fast path (tag lookups only, no
    # `cargo package`); the slow path starts on the second post-merge run.
    # This job holds the `concurrency: release-plz` group, so a hung run blocks
    # every later push to main until cancelled by hand. GitHub's default is 360.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Don't leave the default GITHUB_TOKEN in .git/config. release-plz
          # creates tags and the release branch through the API with the App
          # token, so this is not load-bearing today — but its `git push`
          # fallback paths would otherwise silently authenticate as the default
          # token, which cannot trigger workflows. That failure is invisible;
          # without the persisted credential it is loud instead.
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      # Tags and PRs created with the default GITHUB_TOKEN do NOT start workflow
      # runs — GitHub suppresses them to prevent recursion, and release-plz
      # documents this for `on: push: tags` specifically. With the default token
      # the corrected trigger in docker.yml would be right and still never fire,
      # and CI would never run on the release PR. Mint an App token instead.
      #
      # `owner`/`repositories` are deliberately omitted: the action then scopes
      # the token to the current repository. Do NOT copy the shape used in
      # notify-website.yml — that one sets `repositories: acdp-website` because it
      # dispatches into a different repo, and copying it here would leave
      # release-plz with no permission on this one. Setting `owner` alone is
      # worse still: it widens the token to every repo in the installation.
      #
      # The two `permission-*` inputs are NOT optional hygiene. An App token
      # ignores the job's `permissions:` block above and otherwise inherits
      # EVERY permission the installation holds — which for this App includes
      # `workflows: write`. Without these lines this job would hand a
      # third-party action, and the release-plz binary it downloads, the ability
      # to rewrite .github/workflows/* — authority the default GITHUB_TOKEN it
      # replaces never had. Scoping the repository is not scoping the grant.
      #
      # `app-id` is deprecated in v3 in favour of `client-id`, so each run logs a
      # deprecation warning. Kept because the stored secret is an App ID and
      # notify-website.yml uses the same input; switching needs a new secret.
      #
      # First-party `actions/*` are trusted by major tag here (DECISIONS.md
      # OQ4 names this action explicitly); third-party actions stay SHA-pinned.
      - name: Mint a token whose pushes can trigger workflows
        id: app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.ACDP_BOT_APP_ID }}
          private-key: ${{ secrets.ACDP_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: release-plz
        id: release-plz
        uses: MarcoIeni/release-plz-action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          # Explicit intent, not a behaviour change: action.yml at the SHA
          # pinned above already declares `default: "0.3.160"`, so this is a
          # no-op *today*. It is stated anyway because the floor is real
          # (`git_only` needs >= 0.3.151) and 0.3.165 behaves differently from
          # 0.3.160 on the failure path this config depends on — so a future
          # action-SHA bump must not move the binary version silently. Bump this
          # together with the SHA above, never on its own.
          version: "0.3.160"
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
          # CARGO_REGISTRY_TOKEN is deliberately NOT passed.
          #
          # In git_only mode nothing here publishes to crates.io, so the
          # credential has no legitimate use. Withholding it converts the worst
          # case of upstream release-plz#2693 — `git_only = true` with
          # `publish = false` still attempting a publish, open since 2026-02-27
          # against 0.3.156, one minor below our pin, with a config near-identical
          # to this one — from "eight crates irreversibly published to crates.io"
          # into "one loud authentication failure". crates.io publishes cannot be
          # undone, only yanked, and the `release` code path where that bug lives
          # is the one path that cannot be exercised locally.
          #
          # The secret still exists on the repo; restoring this line is a
          # one-line change if a deliberate publish is ever wanted. Do not
          # restore it merely to silence a failure.

      # U-554. release-plz writes a changelog section only for crates with commits
      # in their own directory, but every crate here is `version = { workspace = true }`
      # and therefore ships the bumped version regardless. `root_changelog_stays_a_pointer`
      # requires each crate to document the version it ships. Those three facts
      # contradict on any release where a crate happens to be unchanged.
      #
      # MEASURED, not hypothetical: v0.1.4 (#286) failed `tests`, `coverage` and
      # `conformance (spec fixtures)` -- all three on that one assertion -- because
      # acdp-registry-auth, -pg and -webhook had ZERO commits since v0.1.3. The
      # previous release did not trip it only because all eight crates happened to
      # change in that window (v0.1.2..v0.1.3: auth 3, webhook 2, types 3, ...).
      # So this recurs on every release with an unchanged crate, and gets likelier
      # as the workspace grows.
      #
      # This documents the non-change rather than weakening the guard: a consumer
      # upgrading auth 0.1.3 -> 0.1.4 otherwise finds no record at all and cannot
      # tell "nothing changed" from "someone forgot".
      - name: Document crates the release bumped but did not change
        if: steps.release-plz.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PR_JSON: ${{ steps.release-plz.outputs.pr }}
        run: |
          set -euo pipefail

          BRANCH="$(printf '%s' "$PR_JSON" | jq -r '.head_branch // empty')"
          if [ -z "$BRANCH" ]; then
            echo "::error::release-plz reported prs_created=true but its pr output has no head_branch. Refusing to guess a branch." >&2
            exit 1
          fi

          git fetch --quiet origin "$BRANCH"
          git checkout --quiet -B "$BRANCH" "origin/$BRANCH"

          VERSION="$(awk '
            /^\[workspace\.package\]/ { in_wp = 1; next }
            /^\[/                       { in_wp = 0 }
            in_wp && /^[[:space:]]*version[[:space:]]*=/ {
              if (match($0, /"[^"]+"/)) { print substr($0, RSTART+1, RLENGTH-2); exit }
            }
          ' Cargo.toml)"

          # A failed parse must stop, not silently stub every crate with an empty
          # heading -- that would satisfy the guard while destroying the changelogs.
          case "$VERSION" in
            [0-9]*.[0-9]*.[0-9]*) : ;;
            *) echo "::error::parsed workspace version '$VERSION', not a semver triple. Refusing to edit changelogs on a bad parse." >&2; exit 1 ;;
          esac

          DATE="$(date -u +%Y-%m-%d)"
          REPO_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          changed=0

          for path in crates/*/CHANGELOG.md; do
            [ -e "$path" ] || continue
            crate="$(basename "$(dirname "$path")")"
            grep -qF "## [$VERSION]" "$path" && continue

            prev="$(grep -m1 -oE '^## \[[0-9]+\.[0-9]+\.[0-9]+\]' "$path" | tr -d '#[] ' || true)"
            if [ -n "$prev" ]; then
              heading="## [$VERSION]($REPO_URL/compare/$crate/v$prev...$crate/v$VERSION) - $DATE"
            else
              heading="## [$VERSION] - $DATE"
            fi

            { head -2 "$path"
              printf '%s\n\n' "$heading"
              printf 'No changes. This crate is released at %s because the workspace shares a\n' "$VERSION"
              printf 'single version (`version = { workspace = true }`), and other crates in it did\n'
              printf 'change. Nothing under `crates/%s/` changed since %s.\n\n' "$crate" "${prev:-the previous release}"
              printf '<!-- Generated by .github/workflows/release-plz.yml. release-plz writes a\n'
              printf '     changelog section only for crates with commits of their own, so without\n'
              printf '     this the crate would ship %s with no record of what it contains. -->\n' "$VERSION"
              tail -n +3 "$path"
            } > "$path.stub.tmp"
            mv "$path.stub.tmp" "$path"
            echo "documented $crate at $VERSION (no changes of its own)"
            changed=1
          done

          if [ "$changed" = 0 ]; then
            echo "every crate already documents $VERSION; nothing to add"
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/*/CHANGELOG.md
          git commit --quiet -m "docs(changelog): record $VERSION for crates the workspace bumped but did not change"
          # The checkout step sets persist-credentials: false deliberately, so the
          # token goes on this one push rather than into .git/config.
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:$BRANCH"
