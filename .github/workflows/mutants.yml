# The mutation oracle for #216 (unit U-502).
#
# WHY THIS EXISTS. `tests/conformance.rs` guards its direct-coverage claims two
# ways, and neither can prove a test asserts anything:
#
#   * two substring guards over `include_str!` -- `assert!(true)`, or the letters
#     of `assert` in a comment, satisfy them; and
#   * `DIRECT_FNS`, added by #249, which makes deleting or renaming a registered
#     test a COMPILE ERROR.
#
# Both are PRESENCE oracles. A test that exists, compiles, runs, and asserts
# nothing passes both. Only breaking the code and watching the test go red
# distinguishes that case, and that is what this job does.
#
# NOT ON pull_request, DELIBERATELY. #216 lists blocking PRs on a mutation run as
# a non-goal, and this is far too slow for it. It is a scheduled ratchet.
name: mutants

on:
  schedule:
    # 05:17 UTC on Mondays. Off the hour on purpose: GitHub's scheduler queues
    # heavily at :00 and a delayed weekly run is a run nobody reads.
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: ""

  # ------------------------------------------------------------------------
  # THE RATCHET. These two numbers ARE the baseline -- #216 asks for a number in
  # the repo, not a description, and this is it.
  #
  # They live in the same file as the check that reads them so the two cannot
  # drift apart, and raising either is a one-line diff that shows up in review.
  # That visibility is the whole mechanism: a budget that can be raised silently
  # is not a ratchet.
  # ------------------------------------------------------------------------

  # Exact size of the mutation scope defined by .cargo/mutants.toml, measured at
  # the sha named in docs/ENGINEERING-LOG.md. Checked as an EQUALITY, never a
  # floor: if the scope silently shrinks -- a glob edited, a scoped file renamed
  # or deleted -- the survivor count falls with it, and a `<=` budget would read
  # that as an improvement. This assertion is what makes the budget below mean
  # anything.
  MUTANTS_EXPECTED_SCOPE: "213"

  # Surviving mutants at that sha. Each is enumerated with its own written reason
  # in docs/ENGINEERING-LOG.md; this number is the machine-readable half of that
  # list. It ratchets DOWN as survivors are killed and must never be raised
  # without a reason recorded in the same commit.
  #
  # THIS NUMBER WENT UP, 1 -> 8, AND THAT NEEDS SAYING PLAINLY. It is not a
  # relaxation: the scope tripled (74 -> 213) when handlers/context.rs entered
  # it, and that file's 139 mutants had never been under an oracle. The first
  # run over the new scope found 28 survivors. TWENTY OF THE 28 WERE KILLED with
  # additive tests in http_integration.rs; these 8 are what is left, each with
  # an argument rather than a shrug. The comparable figure is 28, not 1.
  #
  # The 8 are EIGHT NAMED MUTANTS, not slack. Four are equivalent mutants -- no
  # test can observe them because there is nothing to observe -- and four are
  # blocked on infrastructure this suite does not have:
  #
  # EQUIVALENT (the mutation changes nothing observable):
  #   handlers/log.rs:131:18   `== -> !=` in root_for. Carried unchanged from
  #     U-502 and NOT re-argued here: it guards only `log.cache_root(...)`,
  #     `root_for` returns the same root either way, and append-only makes any
  #     (size -> root) pair immutable. Only WHICH sizes get cached changes.
  #   handlers/context.rs:1223:16  `delete !` on `if !matches.is_empty()` in
  #     run_search_with_refill. H-H-w moved the tenant predicate into the search
  #     SQL (`search_in_tenant`, :1160-1194), so every row reaching this retain
  #     already belongs to the caller's tenant and skipping the block removes
  #     nothing. Positive evidence, not inference: the retain's OWN comparison
  #     `t == tenant` was CAUGHT at the same site. Two mutations at one site with
  #     opposite verdicts is the signature of a redundant guard.
  #   handlers/context.rs:81  delete match arm `"public"` in parse_visibility
  #   handlers/context.rs:82  delete match arm `"restricted"` in parse_visibility
  #     Measured, not assumed: search returns only PUBLIC rows to every requester
  #     -- probed with an anonymous caller, an audience member, and the row's own
  #     producer, all of which see only the public row. So `?visibility=public`
  #     selects everything already visible and `?visibility=restricted` selects
  #     nothing, for anyone; neither arm can change a result. The same site's
  #     `"private"` arm was CAUGHT, which is the tell again -- that is the one
  #     arm still doing work, since it must yield zero where no filter would
  #     yield the visible public rows. These two become observable the moment
  #     search starts serving restricted rows to entitled requesters, and at that
  #     point they are coverage gaps and this budget must drop to 6.
  #   handlers/context.rs:627:39  `>` -> `>=` on `rec.expires_at > Utc::now()`.
  #     The two differ only when a stored expiry equals the clock to the
  #     nanosecond. `expired_idempotency_key_is_not_matched` already pins the
  #     behaviour either side of the boundary; the boundary itself is not
  #     reachable deterministically, and a test that waited for it would be a
  #     flake generator.
  #
  # BLOCKED ON MISSING TEST INFRASTRUCTURE (a real gap, named, not dismissed):
  #   handlers/context.rs:1542:13  delete match arm `LifecycleEventType::Retracted`
  #     in the **did:web** dispatch of lifecycle_transition -- a retract would be
  #     processed as a REPUBLISH. The entire did:web lifecycle branch has zero
  #     coverage: `signed_event_envelope` can only sign as did:key, so
  #     `event.actor.starts_with("did:key:")` is true in every lifecycle test in
  #     the repo. Verified unreachable rather than assumed: a did:web-signed
  #     retract was written and it fails at `key_resolution_unreachable`, because
  #     `retract_verified` resolves the actor through a real `WebResolver` and
  #     playground mode does NOT bypass that. Covering it needs an HTTPS fixture
  #     serving `agents.test`'s did.json with a trusted cert. FOLLOW-UP: that
  #     fixture, which would also unblock the did:web half of publish.
  #   handlers/context.rs:1399:5  `lifecycle_outcome` -> `String::new()`
  #   handlers/context.rs:1399:5  `lifecycle_outcome` -> `"xyzzy"`
  #     The function is `e.wire_code()` behind a metrics label, so the only
  #     observer is a `/metrics` scrape. `/metrics` is deliberately NOT mounted in
  #     the http_integration harness (404, measured), and metrics_integration.rs
  #     exists as its own test binary precisely so "the process-global `metrics`
  #     recorder is isolated from other integration tests" (its own module doc).
  #     Asserting these here would install a global recorder into a binary built
  #     without one and put 158 tests behind shared mutable state. The right home
  #     is metrics_integration.rs, which is outside this unit's path grant.
  #     FOLLOW-UP: a rejected-transition label assertion there.
  #
  # NEW FLOOR: 8. Three of the eight are retired by one HTTPS did:web fixture
  # plus one metrics assertion; two more are retired if search ever serves
  # restricted rows. Nothing here is permanent except the three genuine
  # equivalents (log.rs:131, context.rs:1223, context.rs:627).
  MUTANTS_SURVIVOR_BUDGET: "8"

jobs:
  mutants:
    name: mutation oracle (scoped ratchet)
    runs-on: ubuntu-latest
    # Measured locally at ~7 min wall-clock for this scope with -j4.
    # The cap is generous against a slower runner but finite, so a hung run fails
    # instead of burning the job limit.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # THE SPEC IS NOT OPTIONAL HERE, and this is the step most likely to be
      # mistaken for boilerplate. #216 is titled "mutation oracle for
      # DIRECT-COVERAGE tests". Without ACDP_SPEC_DIR, 42 of the 70 conformance
      # tests -- essentially every `Direct`-registered family test the coverage
      # tables name -- return before asserting anything:
      #
      #     let Some(fixtures) = spec_fixtures() else { eprintln!("...skipping..."); return; };
      #
      # The suite still reports "69 passed" either way (measured: 0.09s skipping
      # vs 0.36s doing the work), so the omission is invisible in a green log. An
      # oracle for those tests that never runs them would be an unverified
      # artefact wearing a number.
      #
      # Our own checkout MUST stay ahead of checkout-spec -- actions/checkout
      # cleans its destination, so running it second wipes the spec tree. Same
      # ordering and the same pinned ref as ci.yml's conformance job; a spec-repo
      # push cannot change this job's result without a commit here.
      # THE SPEC REF IS DERIVED FROM ci.yml, NOT RESTATED HERE, and that is a
      # correctness decision rather than DRY tidiness.
      #
      # `bump-spec.yml:24` passes the bumper exactly ONE filename --
      # `file: .github/workflows/ci.yml`, singular. A second hardcoded copy of the
      # pin in this file would therefore never be bumped: `ci.yml` would move to
      # the new spec and the scheduled mutation job would stay behind forever, with
      # the per-PR conformance job and this job silently measuring DIFFERENT spec
      # versions. A comment saying "keep these in sync" cannot fix that, because
      # the thing that has to act on it is a bot whose input is a single filename.
      # A machine-read signal needs a machine-read fix.
      #
      # The property the pin exists for is preserved, not weakened: `ci.yml:400-402`
      # wants "a spec-repo push cannot change this repo's CI result without a commit
      # here", and a commit here is still required -- in one place instead of two.
      - name: read the spec pin out of ci.yml
        id: pin
        run: |
          set -euo pipefail
          f=.github/workflows/ci.yml

          # Assert the COUNT, not just that a match exists. If ci.yml ever grows a
          # second 40-hex `ref:`, this must fail rather than silently pick whichever
          # line grep happened to reach first -- picking the wrong pin would make
          # this job measure a spec nobody chose.
          n=$(grep -cE '^[[:space:]]*ref: [0-9a-f]{40}[[:space:]]*$' "$f" || true)
          if [ "$n" -ne 1 ]; then
            echo "::error::expected exactly one 40-hex \`ref:\` in $f, found $n." \
                 "The spec pin is derived from that line, so this job refuses to" \
                 "guess which one is meant. Fix the extraction here in the same" \
                 "commit that adds or removes a ref."
            exit 1
          fi

          # And assert it belongs to the checkout-spec step, so this cannot silently
          # start reading some unrelated action's ref.
          #
          # Anchored on `uses:` deliberately. A bare `checkout-spec@` matches TWO
          # lines in ci.yml -- the real usage and a COMMENT at :407 that discusses
          # it -- and the first version of this check counted both and failed the
          # job on its own first run. Found by falsifying the extraction against the
          # real ci.yml rather than by reading it.
          spec_uses='^[[:space:]]*uses:[[:space:]]*.*checkout-spec@'
          if [ "$(grep -cE "$spec_uses" "$f" || true)" -ne 1 ]; then
            echo "::error::expected exactly one checkout-spec@ \`uses:\` line in $f."
            exit 1
          fi
          spec_ln=$(grep -nE "$spec_uses" "$f" | cut -d: -f1)
          ref_ln=$(grep -nE '^[[:space:]]*ref: [0-9a-f]{40}[[:space:]]*$' "$f" | cut -d: -f1)
          if [ "$ref_ln" -le "$spec_ln" ]; then
            echo "::error::the 40-hex ref: at $f:$ref_ln precedes the checkout-spec@" \
                 "usage at :$spec_ln, so it is probably not the spec pin."
            exit 1
          fi

          line=$(grep -E '^[[:space:]]*ref: [0-9a-f]{40}[[:space:]]*$' "$f")
          ref=${line##*: }
          echo "spec pin derived from $f:$ref_ln -> $ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Check out the ACDP spec
        id: spec
        uses: agentcontextdistributionprotocol/acdp-ci/actions/checkout-spec@015910153b61c32abbe018afe85d44868897bf3b # v1
        with:
          ref: ${{ steps.pin.outputs.ref }}
      - uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          tool: cargo-mutants

      # No --file, no --test-workspace, no scope flags: every one of those lives
      # in .cargo/mutants.toml, which cargo-mutants reads automatically. That is
      # deliberate -- `test_workspace` is mandatory for the verdicts to mean
      # anything (DECISIONS.md #17), and a setting that cannot be omitted from the
      # command line cannot be omitted by accident. This is the same command a
      # developer runs locally, which is the point.
      #
      # `|| true` because a surviving mutant makes cargo-mutants exit non-zero,
      # and survivors are BUDGETED here rather than banned. The budget check below
      # is what decides pass or fail -- and it fails if this step produced no
      # readable report at all, so a crashed run cannot slip through as success.
      - name: cargo mutants (scope and test command come from .cargo/mutants.toml)
        env:
          # Inherited by the `cargo test` that cargo-mutants runs for each mutant,
          # which is how the 42 fixture-replay tests above actually execute.
          # REQUIRE mode on purpose: it turns a broken spec checkout into a hard
          # failure instead of 42 tests silently skipping and the run still
          # reporting a number.
          ACDP_SPEC_DIR: ${{ steps.spec.outputs.path }}
          ACDP_REQUIRE_CONFORMANCE: "1"
        # -j1, NOT -j2, and this is measured rather than cautious. On the same
        # 18-mutant shard: -j6 and -j8 each blew past 10 minutes with every
        # mutant still in its Build phase, while -j1 finished in 1m55s (~6.4s per
        # mutant). Parallel jobs get separate build copies and cannot share
        # incremental artifacts, so N simultaneous rebuilds of core plus every
        # dependent crate contend for CPU and disk instead of pipelining.
        # Sequentially the cache stays warm. The full 213-mutant scope is ~23min.
        run: cargo mutants -j1 || true

      # THE RATCHET. Four assertions, each able to fail on its own, and the
      # script ACCUMULATES rather than exiting at the first failure -- an early
      # `exit 1` would mask every assertion after it, so a run that breaks three
      # things would only ever report one of them.
      #
      # Falsified before it shipped, against fabricated reports, one fixture per
      # assertion plus one that trips three at once. The falsification extracts
      # THIS block out of THIS file and runs it, so the text proved to fail is
      # the text that runs here -- not a copy that can drift.
      # AC8 -- THE HARNESS CHECK, and it exists because this unit shipped a wrong
      # baseline once. `cargo-mutants` does not copy `.git` by default;
      # `conformance_gate.rs`'s `no_tracked_file_contains_a_conflict_marker` shells
      # out to `git ls-files` and panics in the copy; `cargo test` stops at the
      # first failing binary, and that gate runs before `http_integration`. Result:
      # 41 of 48 "caught" verdicts were scored by that panic, not by any mutation.
      # `copy_vcs = true` fixes that INSTANCE. This step is what notices the CLASS.
      #
      # Why cargo-mutants cannot notice it for us, measured rather than assumed:
      # its unmutated baseline runs PACKAGE-scoped even under `test_workspace`
      # (baseline.log says `--package=acdp-registry-core`, the mutant logs say
      # `--workspace`). So the baseline never even builds the test binary that was
      # failing, and a green baseline is compatible with every verdict being noise.
      #
      # THE SIGNAL. A harness-wide failure kills everything identically, so one
      # test name becomes the SOLE failing test for almost every mutant. A genuine
      # suite does not concentrate like that. Both numbers measured on this repo:
      #
      #   broken run (no copy_vcs): sole killer `no_tracked_file_contains_a_conflict_marker`
      #                             for 41 of 48 caught  = 85%
      #   healthy run (copy_vcs):   largest sole killer      3 of 48 caught  = ~6%,
      #                             and most mutants die to 2-10 tests at once
      #
      # The 50% threshold sits in a gap an order of magnitude wide, so it is not a
      # tuned number. It is deliberately a CEILING that fails, not a warning.
      - name: harness check (AC8) — no verdict may rest on an unrelated failure
        run: |
          set -uo pipefail
          caught=$(wc -l < mutants.out/caught.txt | tr -d ' ')
          if [ "$caught" -eq 0 ]; then
            echo "no caught mutants; nothing to concentrate. skipping."
            exit 0
          fi
          # For each mutant, the set of tests that failed. Only mutants killed by
          # exactly ONE test can indicate concentration; a mutant killed by several
          # is evidence of a real behavioural kill, not a harness-wide panic.
          for f in mutants.out/log/*.log; do
            case "$(basename "$f")" in baseline.log) continue ;; esac
            names=$(grep -aoE '^test [a-z0-9_:]+ \.\.\. FAILED' "$f" \
                      | sed 's/^test //; s/ \.\.\. FAILED$//' | sort -u)
            [ -z "$names" ] && continue
            [ "$(printf '%s\n' "$names" | grep -c .)" -eq 1 ] && printf '%s\n' "$names"
          done | sort | uniq -c | sort -rn > /tmp/sole_killers.txt || true
          echo "--- sole-killer concentration (count, test) ---"
          head -10 /tmp/sole_killers.txt || true
          if [ ! -s /tmp/sole_killers.txt ]; then
            echo "every caught mutant died to more than one test; no concentration."
            exit 0
          fi
          top_n=$(awk 'NR==1{print $1}' /tmp/sole_killers.txt)
          top_t=$(awk 'NR==1{$1="";sub(/^ /,"");print}' /tmp/sole_killers.txt)
          echo "caught=$caught  largest sole killer=$top_n ($top_t)"
          # Integer comparison, no floats: fail when top_n > caught/2.
          if [ "$((top_n * 2))" -gt "$caught" ]; then
            echo "::error::'$top_t' is the SOLE failing test for $top_n of $caught caught" \
                 "mutants. That is the signature of a failure affecting every mutant" \
                 "equally -- a panic in the build copy, a missing fixture, an" \
                 "environment difference -- rather than of mutations being detected." \
                 "These verdicts are NOT trustworthy. Reproduce with" \
                 "\`cargo mutants\` locally and read which test failed in" \
                 "mutants.out/log/, do not raise the budget."
            exit 1
          fi
          echo "harness check OK"

      - name: ratchet
        run: |
          set -uo pipefail
          OUT=mutants.out
          json="$OUT/outcomes.json"

          # (1) No report, or an unreadable one, must FAIL -- never read as "zero
          #     survivors". A broken run reporting success is the exact failure
          #     mode this whole unit exists to remove. ci.yml's #[ignore] step
          #     takes the same posture for the same reason.
          if [ ! -f "$json" ]; then
            echo "::error::$json does not exist. The mutation run produced no report," \
                 "so this check cannot conclude anything and fails rather than passing."
            exit 1
          fi
          if ! python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$json" 2>/dev/null; then
            echo "::error::$json is not valid JSON. Refusing to infer a survivor count" \
                 "from an unparseable report."
            exit 1
          fi

          # One python3 -c, no heredoc: a heredoc inside a YAML block scalar
          # needs its terminator at column 0, which YAML indentation makes
          # impossible. The assert makes a changed report format an error rather
          # than a silent zero.
          vals="$(python3 -c "import json;d=json.load(open('$json'));k=('total_mutants','missed','caught','timeout','unviable');assert all(isinstance(d.get(x),int) for x in k),'missing/non-integer counts';print(*(d[x] for x in k))" 2>&1)"
          prc=$?
          if [ "$prc" -ne 0 ]; then
            echo "::error::outcomes.json parsed as JSON but lacks the integer counts" \
                 "this check reads (total_mutants/missed/caught/timeout/unviable):" \
                 "$vals. The report format changed; fix this check, do not weaken it."
            exit 1
          fi
          # The word splitting below is the point: $vals is five integers on one
          # line and this is how they become $1..$5. The assert above already
          # proved they are integers, so there is nothing to glob or re-split.
          # shellcheck disable=SC2086
          set -- $vals
          total=$1 missed=$2 caught=$3 timeout=$4 unviable=$5

          echo "scope=$total caught=$caught missed=$missed timeout=$timeout unviable=$unviable"
          echo "expected scope=$MUTANTS_EXPECTED_SCOPE  survivor budget=$MUTANTS_SURVIVOR_BUDGET"

          rc=0

          # (2) EQUALITY on scope, never a floor -- see the env block above.
          if [ "$total" -ne "$MUTANTS_EXPECTED_SCOPE" ]; then
            echo "::error::mutation scope is $total, expected exactly" \
                 "$MUTANTS_EXPECTED_SCOPE. The set of mutants changed. If that was" \
                 "deliberate, update MUTANTS_EXPECTED_SCOPE in this workflow in the" \
                 "same commit -- until then the survivor budget is measuring a" \
                 "different thing than it was set against."
            rc=1
          fi

          # (3) The budget.
          if [ "$missed" -gt "$MUTANTS_SURVIVOR_BUDGET" ]; then
            echo "::error::$missed mutants survived, budget is" \
                 "$MUTANTS_SURVIVOR_BUDGET. A surviving mutant is a change to src/" \
                 "that no test noticed. Kill it with a test, or -- if it is genuinely" \
                 "unreachable -- raise the budget IN THE SAME COMMIT with a written" \
                 "reason. Survivors are listed in mutants.out/missed.txt."
            rc=1
          fi

          # (4) A TIMEOUT is an unresolved verdict, not a kill. Folding it into
          #     "not missed" is the optimistic reading and lets a real survivor
          #     hide behind a slow test.
          if [ "$timeout" -ne 0 ]; then
            echo "::error::$timeout mutant(s) timed out. A timeout is not a kill --" \
                 "the mutant's fate is unknown. Investigate mutants.out/timeout.txt," \
                 "or raise minimum_test_timeout in .cargo/mutants.toml; do not let it" \
                 "stand as an implicit pass."
            rc=1
          fi

          [ "$rc" -eq 0 ] && echo "ratchet OK"
          exit "$rc"

      # Uploaded unconditionally: on a red run these files ARE the finding, and on
      # a green one they are how the next person re-derives the budget instead of
      # trusting it.
      - name: upload the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutants-out
          path: mutants.out/
          if-no-files-found: warn
