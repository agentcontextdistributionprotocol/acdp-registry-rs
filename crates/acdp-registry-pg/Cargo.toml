[package]
name        = "acdp-registry-pg"
version     = { workspace = true }
edition     = { workspace = true }
rust-version = { workspace = true }
license     = { workspace = true }
repository  = { workspace = true }
description = "Postgres-backed implementation of acdp-registry-store"

[lints]
workspace = true

[dependencies]
acdp                = { workspace = true }
acdp-registry-store = { path = "../acdp-registry-store", version = "0.1.3" }
acdp-registry-types = { path = "../acdp-registry-types", version = "0.1.3", default-features = false }
async-trait = { workspace = true }
chrono      = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
sqlx        = { workspace = true }
thiserror   = { workspace = true }
tokio       = { workspace = true }
tracing     = { workspace = true }
uuid        = { workspace = true }

[dev-dependencies]
# `features = ["test-support"]` pulls in the shared cross-backend parity
# assertions that tests/parity.rs runs against this backend.
acdp-registry-store = { path = "../acdp-registry-store", version = "0.1.3", features = ["test-support"] }
