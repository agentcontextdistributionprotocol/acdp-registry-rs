[package]
name        = "acdp-registry-server"
version     = { workspace = true }
edition     = { workspace = true }
rust-version = { workspace = true }
license     = { workspace = true }
repository  = { workspace = true }
description = "ACDP registry HTTP server binary"

[lints]
workspace = true

[[bin]]
name = "acdp-registry"
path = "src/main.rs"

[dependencies]
acdp                  = { workspace = true }
acdp-registry-auth    = { path = "../acdp-registry-auth", version = "0.1.6" }
acdp-registry-core    = { path = "../acdp-registry-core", version = "0.1.6" }
acdp-registry-pg      = { path = "../acdp-registry-pg", version = "0.1.6", optional = true }
acdp-registry-sqlite  = { path = "../acdp-registry-sqlite", version = "0.1.6", optional = true }
acdp-registry-store   = { path = "../acdp-registry-store", version = "0.1.6" }
acdp-registry-types   = { path = "../acdp-registry-types", version = "0.1.6" }
acdp-registry-webhook = { path = "../acdp-registry-webhook", version = "0.1.6" }
anyhow             = { workspace = true }
async-trait        = { workspace = true }
axum               = { workspace = true }
axum-server        = { workspace = true }
# W5/U-530: an EXPLICIT rustls crypto provider, because the graph enables two.
#
# `axum-server`'s `tls-rustls` feature turns on rustls's `aws-lc-rs` (root
# `Cargo.toml:35`) and `reqwest`'s `rustls-tls` turns on `ring` via
# `hyper-rustls` (`:72`). Both edges are unconditional -- neither is
# `optional` nor behind a storage feature -- so EVERY build variant carries
# two providers and rustls refuses to pick one. Nothing in `crates/` called
# `install_default`, so `registry.tls.enabled = true` panicked at startup
# (rc=101) inside rustls's provider lookup, AFTER `main` had already logged
# `listening` with the address. Measured, not inferred: U-532.
#
# `ring` rather than `aws-lc-rs`: it is what `hyper-rustls`/`tokio-rustls`
# already select, and `aws-lc-rs` drags `aws-lc-sys` + `prebuilt-nasm` -- a
# C/asm build dependency -- into the shipped binary's TLS path.
#
# This is a NORMAL dependency on purpose. It was previously `[dev-dependencies]`
# only, which is precisely why the panic could not reach any test binary.
rustls             = { version = "0.23", features = ["ring"] }
base64             = { workspace = true }
chrono             = { workspace = true }
dotenvy            = { workspace = true }
rand               = { workspace = true }
tokio              = { workspace = true }
tower              = { workspace = true }
tower-http         = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }

[features]
default        = ["storage-sqlite"]
storage-pg     = ["dep:acdp-registry-pg"]
storage-sqlite = ["dep:acdp-registry-sqlite"]
storage-memory = []
playground     = ["acdp-registry-core/playground"]

[dev-dependencies]
# REG-3 Phase 6: `SsrfPolicy::allow_test_loopback()` is gated behind
# `test-transport` (same idiom `acdp-registry-webhook`'s own dev-dependency
# uses) so the loopback-permissive policy used by
# `anchors_uri_never_dereferenced_publish_and_retrieve` (http_integration.rs)
# is only reachable from test builds, never from the production binary.
acdp           = { workspace = true, features = ["test-transport"] }
http-body-util = "0.1"
hex            = { workspace = true }
serde          = { workspace = true }
serde_json     = { workspace = true }
sqlx           = { workspace = true }
tempfile       = "3"
ed25519-dalek  = { version = "3.0", features = ["rand_core"] }
uuid           = { workspace = true }
# Serialize PG integration tests so they don't fight over the shared
# truncate-and-test database. SQLite tests use disposable tempfiles so
# they don't need this.
serial_test    = "3"
# U-521 option B: generate the did:web fixture's CA+leaf chain at test runtime
# instead of committing PEM files. `.gitignore:39-43` forbids TLS material
# repo-wide (`*.pem`/`*.crt`/`*.key`) with its only negation an empty
# placeholder, and the repo has zero committed TLS material -- so a committed
# fixture would have needed a repo-policy exception. Generating it needs none,
# commits no private key, and removes the expiry problem entirely: nothing that
# does not exist can lapse.
#
# **Dev-only, and that is load-bearing for a reason the section heading does not
# give.** The workspace sets `resolver = "2"` (`../../Cargo.toml:12`), under
# which dev-dependency features are NOT unified into the normal build. Under
# `resolver = "1"` this line WOULD be a production change wearing a test-only
# label, so if that key ever changes this dependency needs re-deciding, not
# merely re-testing.
#
# This paragraph arrived here from U-521's `rustls` dev-dependency, which U-530
# deleted after promoting `rustls` to `[dependencies]`. It was moved rather than
# deleted with that entry on purpose: it was written for a future reader, not
# for U-521, and `rcgen` is now the only dev-only entry it still protects. The
# `rustls` half of U-521's "byte-identical `no-dev` graph" measurement expired
# the moment `rustls` became a normal dependency; the `rcgen` half did not.
rcgen          = "0.14"
