[package]
name        = "acdp-registry-server"
version     = { workspace = true }
edition     = { workspace = true }
rust-version = { workspace = true }
license     = { workspace = true }
repository  = { workspace = true }
description = "ACDP registry HTTP server binary"

[lints]
workspace = true

[[bin]]
name = "acdp-registry"
path = "src/main.rs"

[dependencies]
acdp                  = { workspace = true }
acdp-registry-auth    = { path = "../acdp-registry-auth", version = "0.1.3" }
acdp-registry-core    = { path = "../acdp-registry-core", version = "0.1.3" }
acdp-registry-pg      = { path = "../acdp-registry-pg", version = "0.1.3", optional = true }
acdp-registry-sqlite  = { path = "../acdp-registry-sqlite", version = "0.1.3", optional = true }
acdp-registry-store   = { path = "../acdp-registry-store", version = "0.1.3" }
acdp-registry-types   = { path = "../acdp-registry-types", version = "0.1.3" }
acdp-registry-webhook = { path = "../acdp-registry-webhook", version = "0.1.3" }
anyhow             = { workspace = true }
async-trait        = { workspace = true }
axum               = { workspace = true }
axum-server        = { workspace = true }
base64             = { workspace = true }
chrono             = { workspace = true }
dotenvy            = { workspace = true }
rand               = { workspace = true }
tokio              = { workspace = true }
tower              = { workspace = true }
tower-http         = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }

[features]
default        = ["storage-sqlite"]
storage-pg     = ["dep:acdp-registry-pg"]
storage-sqlite = ["dep:acdp-registry-sqlite"]
storage-memory = []
playground     = ["acdp-registry-core/playground"]

[dev-dependencies]
# REG-3 Phase 6: `SsrfPolicy::allow_test_loopback()` is gated behind
# `test-transport` (same idiom `acdp-registry-webhook`'s own dev-dependency
# uses) so the loopback-permissive policy used by
# `anchors_uri_never_dereferenced_publish_and_retrieve` (http_integration.rs)
# is only reachable from test builds, never from the production binary.
acdp           = { workspace = true, features = ["test-transport"] }
http-body-util = "0.1"
hex            = { workspace = true }
serde          = { workspace = true }
serde_json     = { workspace = true }
sqlx           = { workspace = true }
tempfile       = "3"
ed25519-dalek  = { version = "3.0", features = ["rand_core"] }
uuid           = { workspace = true }
# Serialize PG integration tests so they don't fight over the shared
# truncate-and-test database. SQLite tests use disposable tempfiles so
# they don't need this.
serial_test    = "3"
# U-521: nameable only so the did:web TLS fixture can pick a CryptoProvider
# explicitly. Two providers are enabled in this workspace -- `aws-lc-rs` via
# `axum-server/tls-rustls` and `ring` via `hyper-rustls` <- `reqwest` <-
# `acdp-client` -- and nothing in `crates/` calls `install_default`, so rustls
# refuses to pick one and every TLS handshake fails at process level.
#
# **This is a dev-dependency and that is load-bearing, but not for the reason
# the section heading suggests.** The workspace sets `resolver = "2"`
# (`../../Cargo.toml:12`), under which dev-dependency features are NOT unified
# into the normal build. Under `resolver = "1"` these lines WOULD be a production
# change wearing a test-only label, so if that key ever changes this dependency
# needs re-deciding, not merely re-testing.
#
# MEASURED, not reasoned -- `cargo tree -e features,no-dev` for this package is
# byte-identical with and without this entry, both inverted-on-rustls (469 lines)
# and forward (3406 lines). The same probe WITH dev edges does show the
# difference, so "identical" is a real read and not a blind comparison.
#
# `Cargo.lock` does gain two edges (`rustls` under this package, and `log` under
# `rustls`, whose default `logging` feature pulls it). That is not a
# contradiction: the lock records the union of the dependency graph and is not
# feature-resolved per target. The measurement above is what says the shipped
# binary's resolution is unchanged.
#
# The equivalent gap in the PRODUCTION binary (`src/main.rs`'s
# `bind_rustls` path, which no test enters) is NOT fixed here: it is filed as
# U-530. This entry fixes the test binary only.
rustls         = { version = "0.23", features = ["ring"] }
