[package]
name        = "acdp-registry-store"
version     = { workspace = true }
edition     = { workspace = true }
rust-version = { workspace = true }
license     = { workspace = true }
repository  = { workspace = true }
description = "ExtendedRegistryStore trait (pagination + health + migrations) for acdp-registry-rs"

[lints]
workspace = true

[features]
# Exposes `parity`, the cross-backend assertion suite each backend's
# tests/parity.rs calls. Off by default so it never ships in a normal build.
test-support = ["dep:tokio"]

[dependencies]
acdp                = { workspace = true }
acdp-registry-types = { path = "../acdp-registry-types", version = "0.1.3", default-features = false }
async-trait         = { workspace = true }
base64              = { workspace = true }
chrono              = { workspace = true }
serde               = { workspace = true }
serde_json          = { workspace = true }
tokio               = { workspace = true, optional = true }

[dev-dependencies]
# `search_in_tenant`'s default impl is `async`, so its unit tests need a
# runtime. The dependency above is optional (behind `test-support`, for
# `parity`); this one is unconditional but dev-only, so it never reaches a
# downstream build.
tokio = { workspace = true }
