[package]
name        = "acdp-registry-core"
version     = { workspace = true }
edition     = { workspace = true }
rust-version = { workspace = true }
license     = { workspace = true }
repository  = { workspace = true }
description = "axum router + handlers for acdp-registry-rs (storage-agnostic)"

[lints]
workspace = true

[dependencies]
acdp                  = { workspace = true }
acdp-registry-auth    = { path = "../acdp-registry-auth", version = "0.9.0" }
acdp-registry-store   = { path = "../acdp-registry-store", version = "0.9.0" }
acdp-registry-types   = { path = "../acdp-registry-types", version = "0.9.0" }
acdp-registry-webhook = { path = "../acdp-registry-webhook", version = "0.9.0" }
axum       = { workspace = true }
chrono     = { workspace = true }
http       = "1"
jsonwebtoken = { workspace = true }
reqwest    = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
tokio      = { workspace = true }
tower      = { workspace = true }
tower-http = { workspace = true }
tracing    = { workspace = true }
uuid       = { workspace = true }
async-trait = { workspace = true }
base64      = { workspace = true }
metrics     = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
ring        = "0.17.14"
zeroize     = "1.9.0"
url         = { workspace = true }

[dev-dependencies]
tempfile = "3"
acdp-registry-sqlite = { path = "../acdp-registry-sqlite", version = "0.9.0" }
# Test-only: needed to prove `make_request_span` actually RECORDS the request id.
# A `Span`'s Debug impl emits metadata only -- no field names, no values -- so a
# Debug-string assertion cannot distinguish a recorded id from a missing one. It
# takes a real subscriber to observe the field, and without one the span is
# `disabled` and records nothing at all. Already a workspace dependency (the
# server binary uses it), so this adds no new external crate.
tracing-subscriber = { workspace = true }
# Test-only: `keyless::jwks`'s unit tests fetch from a loopback HTTPS
# issuer (the fetcher is `https_only`). A per-process CA from `rcgen`, served
# by `axum-server`; `rustls` to pick the `ring` provider explicitly, since
# the graph enables two. All three are already in the workspace graph through
# `acdp-registry-server`'s dev-dependencies, so they add no crate.
rcgen       = "0.14"
axum-server = { workspace = true }
rustls      = { version = "0.23", features = ["ring"] }

[features]
default    = []
playground = []
# Test builds only: `test_egress.rs`, the `ACDP_TEST_EGRESS` outbound
# override the spawned-binary keyless test (`tests/keyless_e2e.rs`) needs.
# Enabled solely by `acdp-registry-server`'s `[dev-dependencies]` line for
# this crate. Under `resolver = "2"` dev-dependency features unify only into
# builds that compile test targets: `cargo tree -e normal,features` shows no
# `test-egress` for the default features, `-p acdp-registry-server
# --no-default-features --features storage-pg`, or `--workspace
# --all-features`. `main.rs` calls `test_egress::*` unconditionally and
# relies on the gating inside `test_egress.rs` (both fns return `None`
# without the feature). `tests/keyless_e2e.rs` pins the manifests. Never
# enable it from `[dependencies]` or a default feature list.
test-egress = ["acdp/test-transport"]
