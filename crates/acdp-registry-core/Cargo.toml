[package]
name        = "acdp-registry-core"
version     = { workspace = true }
edition     = { workspace = true }
rust-version = { workspace = true }
license     = { workspace = true }
repository  = { workspace = true }
description = "axum router + handlers for acdp-registry-rs (storage-agnostic)"

[lints]
workspace = true

[dependencies]
acdp                  = { workspace = true }
acdp-registry-auth    = { path = "../acdp-registry-auth", version = "0.1.3" }
acdp-registry-store   = { path = "../acdp-registry-store", version = "0.1.3" }
acdp-registry-types   = { path = "../acdp-registry-types", version = "0.1.3" }
acdp-registry-webhook = { path = "../acdp-registry-webhook", version = "0.1.3" }
axum       = { workspace = true }
chrono     = { workspace = true }
http       = "1"
reqwest    = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
tokio      = { workspace = true }
tower      = { workspace = true }
tower-http = { workspace = true }
tracing    = { workspace = true }
uuid       = { workspace = true }
async-trait = { workspace = true }
base64      = { workspace = true }
metrics     = { workspace = true }
metrics-exporter-prometheus = { workspace = true }

[dev-dependencies]
tempfile = "3"
acdp-registry-sqlite = { path = "../acdp-registry-sqlite", version = "0.1.3" }
# Test-only: needed to prove `make_request_span` actually RECORDS the request id.
# A `Span`'s Debug impl emits metadata only -- no field names, no values -- so a
# Debug-string assertion cannot distinguish a recorded id from a missing one. It
# takes a real subscriber to observe the field, and without one the span is
# `disabled` and records nothing at all. Already a workspace dependency (the
# server binary uses it), so this adds no new external crate.
tracing-subscriber = { workspace = true }

[features]
default    = []
playground = []
