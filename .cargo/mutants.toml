# cargo-mutants configuration — the mutation oracle for #216 (unit U-502).
#
# WHAT THIS IS FOR. `conformance.rs`'s anti-vacuity guards prove a registered test
# EXISTS (a substring search, plus the compile-checked `DIRECT_FNS` table added by
# #249). Neither can prove a test ASSERTS anything: a test that exists, compiles,
# runs, and asserts nothing satisfies both. Only breaking the code and watching the
# test go red proves that. This file configures that oracle.
#
# THE DOCUMENTED COMMAND IS JUST:
#
#     cargo mutants
#
# and it must stay that short, because every setting below is load-bearing.
#
# ---------------------------------------------------------------------------
# WHY THIS FILE IS AT `.cargo/mutants.toml` AND NOT `mutants.toml` AT THE ROOT
# ---------------------------------------------------------------------------
# `cargo-mutants` reads `.cargo/mutants.toml` AUTOMATICALLY. A root-level
# `mutants.toml` is read only when every invocation passes `--config mutants.toml`.
#
# That difference is a correctness property here, not a preference. `test_workspace`
# below is MANDATORY (see next block); a run that omits it produces a survivor list
# full of false positives, which is indistinguishable from a real one without
# re-deriving every entry by hand — worse than no baseline at all. A config the tool
# picks up by itself cannot be omitted by accident. A root file plus a required flag
# makes "ran it without the flag" a one-typo mistake that silently yields a wrong
# answer, and a wrong answer that looks right is the failure mode this whole unit
# exists to remove.
#
# ---------------------------------------------------------------------------
# `test_workspace` — MANDATORY, and the reason is measured, not stylistic
# ---------------------------------------------------------------------------
# Measured in DECISIONS.md #17 (unit H-M, PR #252). By default cargo-mutants tests
# each mutant with a PACKAGE-scoped command:
#
#     cargo test --verbose --package=acdp-registry-core@0.1.3
#
# That runs acdp-registry-core's own unit tests and nothing else. This repo's
# coverage does not live there — it lives in acdp-registry-server's integration
# suites. So the default configuration reports survivors for code that IS covered,
# by tests it never ran. Demonstrated on one mutant, both ways:
#
#   receipt.rs:58:21 `replace || with && in validated_fragment`
#     package-scoped   -> MISSED
#     test_workspace   -> CAUGHT, by `malformed_retired_receipt_key_fails_startup`
#                         in crates/acdp-registry-server/src/main.rs — a DIFFERENT
#                         package, which is precisely why package scoping is blind.
#
# Under test_workspace the whole of receipt.rs comes back 7 caught / 2 unviable /
# 0 missed: no coverage gap, and the lone survivor was an artefact of scope.
test_workspace = true

# ---------------------------------------------------------------------------
# `copy_vcs` — NOT cosmetic. Without it the whole baseline is a lie.
# ---------------------------------------------------------------------------
# cargo-mutants tests each mutant in a COPY of the tree under $TMPDIR, and by
# default does not copy `.git`. `conformance_gate.rs`'s
# `no_tracked_file_contains_a_conflict_marker` shells out to `git ls-files`, so in
# that copy it panics:
#
#     `git ls-files` failed in /…/cargo-mutants-…tmp:
#     fatal: not a git repository (or any of the parent directories): .git
#
# That failure has nothing to do with any mutation, and `cargo test` stops at the
# first failing test binary. conformance_gate runs BEFORE http_integration, so
# every mutant whose real killer lives later was reported CAUGHT by this panic
# instead. MEASURED on the first baseline: 48 "caught", of which **41 were caught
# only by this** — every single handlers/log.rs verdict was noise. Just 7 were
# genuine, all in receipt.rs, killed by core's own unit tests, which run before
# the poisoned gate.
#
# THE REASON THIS SLIPPED PAST THE OBVIOUS CHECK IS WORTH KEEPING. The hazard was
# already written down here: "a pre-existing failure elsewhere in the workspace
# would mark mutants CAUGHT for the wrong reason." It was checked, with
# `cargo test --locked --workspace` in the worktree, which passed 632/0. The check
# was sound and the answer was true -- of the WRONG TREE. The failure exists only
# in cargo-mutants' copy, which is the tree the verdicts actually come from, and
# the package-scoped baseline never runs conformance_gate so it cannot see it
# either. Checking the tree you are standing in says nothing about the tree the
# tool builds.
#
# With `.git` copied, `git ls-files` succeeds and that mutant is caught by the ten
# http_integration log tests that genuinely exercise it.
#
# Note for a non-worktree checkout: here `.git` is a 4 KB worktree POINTER file
# holding an absolute path to the parent repo's gitdir, so copying it is nearly
# free and resolves because that path still exists. In a plain clone this copies
# the real `.git` directory instead. Both work; only the cost differs.
copy_vcs = true

# ---------------------------------------------------------------------------
# THE RATCHETING SCOPE — 351 mutants, and every inclusion below is deliberate
# ---------------------------------------------------------------------------
# MEASURED AT c41bf14 (unit U-552), with the command that reproduces it:
#
#     cargo mutants --list            # config is auto-read from this file
#
#     crates/acdp-registry-core/src/handlers/context.rs   139
#     crates/acdp-registry-core/src/handlers/log.rs        65
#     crates/acdp-registry-core/src/receipt.rs              9
#     crates/acdp-registry-sqlite/src/store.rs            138
#     ----------------------------------------------------------
#     total                                               351
#
# The widening is PURELY ADDITIVE: `comm -23` of the sorted 213-mutant list
# against the 351-mutant one is empty, so no previously-scoped mutant was lost.
# That is checked rather than assumed, because a glob edit that silently DROPS a
# file would also shrink the survivor count and read as an improvement.
#
# `MUTANTS_EXPECTED_SCOPE` in .github/workflows/mutants.yml pins exactly this
# number, as an EQUALITY rather than a floor, and the two are checked against
# each other every time this list changes rather than assumed to agree.
#
# NOT the whole workspace: 1427 mutants at a66e1f2, measured via
#
#     cargo mutants --list --no-config
#
# At the ~6.2s/mutant marginal cost measured in DECISIONS.md #17 that is ~2.5h,
# and #216 lists "blocking PRs on a full mutation run" as a non-goal. This is a
# scheduled job over a bounded set, by design. 351 of 1427 is 24.6%.
# (Was 213 of 1427 = 14.9% before U-552 added sqlite/src/store.rs.)
#
# ---------------------------------------------------------------------------
# sqlite/src/store.rs — DEFERRED BY U-540, PAID DOWN, AND ADMITTED BY U-552
# ---------------------------------------------------------------------------
#
# THIS IS THE UNIT THE DEFERRAL WAS WAITING FOR. The text below is kept rather
# than deleted, because the estimate it records was wrong in an instructive
# direction and the correction is the useful part.
#
# WHAT U-540 PREDICTED. "Widening would take the scope to 351 and the survivor
# count past the budget. Measured over 95 of its 138 mutants: 47 caught / 14
# missed / 34 unviable -- a 23% survivor rate among viable mutants, extrapolating
# to roughly 20 survivors against a budget of 5."
#
# WHAT THE FULL MEASUREMENT FOUND. U-549/U-550 ran all 138 across 8 shards:
# 79 caught / 8 missed / 51 unviable / 0 timeout. **Eight survivors, not ~20.**
# The extrapolation was off by 2.5x because a 95-of-138 partial is not a random
# sample of the file -- the unjudged 43 were the tail, and the survivor rate is
# not uniform across a file's functions. A partial run extrapolates badly, and
# the number it produced was load-bearing enough to defer a whole scope change.
#
# WHAT U-552 THEN DID, under this file's own "PAY FIRST, WIDEN LAST" rule:
# killed SIX of the eight, and admitted the glob carrying TWO.
#
#   killed  994:35  `>` -> `<`   and  `>` -> `==`   (a keyed SUPERSEDING replay)
#   killed  568:9   put
#   killed  821:9   mark_superseded
#   killed  832:9   first_version_ctx_id
#   killed  923:9   idempotency_evict_expired
#   carried 994:35  `>` -> `>=`  EQUIVALENT
#   carried 1306:35 `!=` -> `==` UNREACHABLE-BY-DESIGN (behind BEGIN IMMEDIATE)
#
# THE BUDGET GOES UP, 5 -> 7, AND THAT IS A RAISE. Saying it "stays the same
# because the scope grew" would be spin: the number of mutants this repo admits
# it cannot kill went from five to seven. The aspiration stated here was that the
# last unit would "add this glob with the budget unchanged", and that is NOT what
# happened, because two of the eight are not killable by any test:
#
#   * `994:35 >= ` is true on exactly the same inputs as `>`. Step 1 first runs
#     `DELETE ... WHERE expires_at_ms <= now`, so a surviving row necessarily has
#     `expires_at_ms >= now_ms + 1` and `expires_at > now` is unconditionally
#     true. There is no input that distinguishes them.
#   * `1306:35` sits inside the `inserted == 0` branch, which `BEGIN IMMEDIATE`
#     makes unreachable -- every would-be racer is serialised and refused at
#     step 1 instead. Its sibling GUARD mutant at `1284:29` is CAUGHT while this
#     body mutant is MISSED, and guard-caught/body-missed is the signature of a
#     branch that never executes.
#
# Both are enumerated in MUTANTS_SURVIVORS with those reasons, so the raise is
# two named mutants rather than a number moved. Per-mutant, the ratchet TIGHTENED:
# 5 survivors in 213 (2.3%) -> 7 in 351 (2.0%), with 138 previously unwatched
# mutants now watched.
#
# SUPERSEDED BY U-552 -- the two paragraphs that follow described the DEFERRAL,
# and there is no longer one: store.rs is in examine_globs above and the
# committed scope is 351. They are kept because the `--file` mechanic they
# document is still true and still useful, not because the deferral is.
#
# You do NOT need this glob to work on those survivors: `--file` UNIONS with
# this list (demonstrated below), so a local run can target a file without
# editing the committed scope.
#
# THE INVENTORY WAS NOT LOST WITH THAT DEFERRAL -- it was in docs/MUTATION-SCOPE-
# CANDIDATES.md and issue #307. The "14 known survivors" that sentence counted
# is itself now historical: the full measurement found 8, and U-552 killed 6 of
# those, leaving 2 carried with written reasons.
#
# #216 step 1 scopes the oracle to "receipt/log/lineage emission, the publish
# path, visibility filtering". Receipt, log and the publish path were already
# here. This file is the other two: `lineage` and `events_for_lineage`, and the
# visibility filtering -- `visible_ctx_ids`, `list_contexts`, and the
# `LIST_VISIBILITY_SQLITE` / `SEARCH_VISIBILITY_SQLITE` predicates.
#
# It is also the DEFAULT backend (`default = ["storage-sqlite"]` in
# acdp-registry-server), which matters more than it looks: `test_workspace`
# makes every mutant's verdict come from `cargo test --workspace`, so a file
# only reachable under a non-default feature would report survivors for code
# the command never compiled. This one is reached.
#
# TWO CANDIDATES WERE REJECTED ON MEASUREMENT, and both rejections are worth
# keeping because the next person will reach for them in this order:
#
#   acdp-registry-pg/src/store.rs (136) -- DISQUALIFIED. Its tests skip to
#   SUCCESS when ACDP_REGISTRY_TEST_PG_URL is unset (`pg_url_or_skip`, in
#   crates/acdp-registry-pg/tests/parity.rs), and nothing here provides a
#   database. Every VIABLE one would therefore come back MISSED -- stated that
#   way on purpose: the unviable ones never compile, so they have no verdict to
#   be wrong about, and "all 136" would be an overstatement in the alarming
#   direction. The point stands either way, because a survivor list that is
#   entirely false positives is what the `test_workspace` block above calls
#   worse than no baseline at all -- the same failure, arriving by a different
#   door. This is a prediction from the gating code, not a measured run; it was
#   not measured because doing so costs a 136-mutant run to confirm a skip that
#   `pg_url_or_skip` states in four lines.
#
#   acdp-registry-store/src/parity.rs (89) -- STRUCTURALLY MEANINGLESS. It is
#   `test-support` harness code that never ships. Mutating a test's own
#   assertion weakens the test, the weakened test still passes, so the mutant
#   survives BY CONSTRUCTION and no survivor has a remedy. Mutation testing asks
#   whether tests catch defects in production code; pointing it at the tests
#   inverts the question.
#
# DEFERRED, not rejected: acdp-registry-store/src/lib.rs (38) holds
# `retrieve_visible`, the authoritative RFC-ACDP-0008 §4.5 predicate. Worth
# covering -- but ~30 of its 38 mutants target DEFAULT trait method bodies that
# both real backends override, so they are unreachable and would arrive as
# budgeted survivors sharing one repetitive excuse. That deserves its own unit
# and a real answer, not a bulk exemption.
#
# ---------------------------------------------------------------------------
# handlers/context.rs — THE EXCLUSION THAT WAS, AND WHY IT IS NOW AN INCLUSION
# ---------------------------------------------------------------------------
# This paragraph used to say "NOT handlers/context.rs", and the glob list below
# has included it since U-504. The comment outlived the decision it explained and
# survived several edits to this file — which is exactly the failure this file
# spends 159 lines trying to prevent, so it is corrected here rather than quietly
# deleted.
#
# THE ORIGINAL REASONING, which was sound: at 5c401db context.rs was held by
# another unit in the same wave and would change underneath this scope, so a
# budget keyed to it would go red for a reason unrelated to the property it
# guards — and a red check nobody can explain gets disabled, after which the real
# regression walks through. That hazard was real and is not hypothetical: #17
# recorded context.rs at 132 one day before this file measured 134.
#
# WHY IT NO LONGER APPLIES: the unit holding context.rs finished and landed. The
# file is now stable enough to key a budget to, and it is the densest core logic
# in the core scope — 139 of the 351 mutants, and the home of four of the seven
# budgeted survivors enumerated in mutants.yml. Excluding it would have left the
# ratchet measuring the thin end of the codebase.
#
# THE DRIFT IS ITSELF THE LESSON. Between 5c401db and 60b08b7 context.rs moved
# 134 -> 139 while nothing here noticed. Any arithmetic built on the old figure
# is wrong by construction: 74 + 134 = 208, not the 213 this scope actually
# contains. That is why the numbers above name the command that reproduces them
# — a figure without its command is a claim, not a measurement.
#
# A NOTE ON WIDENING THIS. `--file` UNIONS with these globs rather than replacing
# them. RE-MEASURED at 60b08b7, because the original demonstration (config alone
# -> 9; config + `--file handlers/log.rs` -> 74) was taken when the glob list held
# only receipt.rs and no longer reproduces — a `--file` naming a path already in
# the globs now changes nothing, so it cannot show the property. Using a file
# OUTSIDE the scope instead:
#
#     cargo mutants --list                                          -> 213
#     cargo mutants --list --no-config --file .../handlers/admin.rs ->  49
#     cargo mutants --list            --file .../handlers/admin.rs  -> 262
#
# 213 + 49 = 262 exactly: a union, not a replacement. So a stray `--file` can only
# ever widen a run, never silently narrow it to nothing. To deliberately escape
# this scope, pass `--no-config`.
examine_globs = [
    "crates/acdp-registry-core/src/receipt.rs",
    "crates/acdp-registry-core/src/handlers/log.rs",
    "crates/acdp-registry-core/src/handlers/context.rs",
    "crates/acdp-registry-sqlite/src/store.rs",
]

# ---------------------------------------------------------------------------
# EDITING THE LIST ABOVE BREAKS CI UNTIL YOU RE-MEASURE. That is deliberate.
# ---------------------------------------------------------------------------
# So does editing any `src/` file NAMED in it. `MUTANTS_EXPECTED_SCOPE` in
# .github/workflows/mutants.yml is an EQUALITY, not a floor, so adding or
# deleting a single mutable expression in any scoped file fails the scheduled
# run until BOTH the figures above and that variable are updated. A floor would
# tolerate silent shrinkage, which is the exact failure the pin exists to
# prevent -- so this is the intended behaviour and not a defect to soften.
#
# The remedy, wherever you hit it:
#
#     cargo mutants --list | wc -l                      # the new total
#     cargo mutants --list | sed 's/:[0-9]*:[0-9]*:.*//' | sort | uniq -c
#                                                       # the new per-file split
#
# then update the block above AND `MUTANTS_EXPECTED_SCOPE`. The workflow's
# scope-check step prints these same two commands when it fails, because that
# red log is where a reader actually meets this, not here.

# A floor under the auto-set per-mutant timeout. cargo-mutants derives the timeout
# from the baseline `cargo test`, which is the right default; this only stops a
# loaded machine from reporting a TIMEOUT where the real answer is CAUGHT. A mutant
# that genuinely hangs still costs this much and no more.
minimum_test_timeout = 300

# ---------------------------------------------------------------------------
# TWO TOOL BEHAVIOURS MEASURED WHILE FALSIFYING THIS CONFIG (cargo-mutants 27.1.0)
# ---------------------------------------------------------------------------
# Both were found by checking that `test_workspace` actually changes the emitted
# command, rather than inferring it from a survivor count. Recorded here because a
# future reader will otherwise reach for the same two things and be misled.
#
# 1. `test_workspace` applies to MUTANT runs but NOT to the baseline run. Read out
#    of the logs of a single-mutant run under this config:
#
#      mutants.out/log/baseline.log
#          cargo test --verbose --package=acdp-registry-core@0.1.3
#      mutants.out/log/…receipt.rs_line_146_col_5.log
#          cargo test --verbose --workspace
#
#    The verdicts are therefore workspace-scoped, which is what matters and what
#    DECISIONS.md #17 requires. The caveat is narrower than it looks but real: the
#    unmutated baseline only proves the MUTATED PACKAGE's own tests pass, so a
#    pre-existing failure elsewhere in the workspace would not be caught by the
#    baseline and would then mark mutants CAUGHT for the wrong reason. Guard against
#    that by keeping `cargo test --workspace` green independently — CI already does.
#
# 2. `--examine-re` FAILS OPEN for mutants whose description has no matchable name.
#    Measured against a regex that can match nothing:
#
#      --no-config --list --examine-re 'zzz_no_such_thing_zzz'   -> 13 mutants
#      --no-config --list --examine-re 'delete field'            -> 13 mutants
#      --no-config --list --examine-re 'ed25519_multibase'       -> 15  (13 + 2)
#
#    The constant 13 is a floor: the `delete field … from struct … expression`
#    mutants in acdp-registry-store are emitted regardless of the regex. So
#    `--examine-re` cannot be trusted to isolate one mutant WHEN RUN UNDER
#    `--no-config` (which is how the 13 above were measured). Under the
#    committed config the fail-open floor is ZERO, and a fully anchored,
#    regex-escaped `-F '^<verbatim --list line>$'` isolates exactly one --
#    measured in U-552 on six real mutants, and it is the escape hatch to use
#    when a single mutant must be re-run by hand. `examine_globs` above
#    does NOT have this defect — it filters those 13 out correctly, which is a
#    further reason the scope is expressed as globs here rather than as a regex.
#    To isolate a single mutant, use `--file` plus a line-scoped check of `--list`.
