[package]
name = "acdp-registry-live-smoke"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"
description = "Publish -> resolve -> retract -> resolve against a live ACDP registry, through acdp's CrossRegistryResolver"

# Standalone: excluded from the root workspace (see the root Cargo.toml).
[workspace]

[dependencies]
# The umbrella crate and feature Seam uses (seam-context-acdp). The version
# leads Seam's pin on purpose: 0.17.0 adds the RFC-ACDP-0018 recall surface the
# /changes probe in src/main.rs verifies through.
acdp       = { version = "=0.20.0", features = ["client", "keyless"] }
anyhow     = "1"
base64     = "0.23"
chrono     = "0.4"
reqwest    = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
tokio      = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
uuid       = { version = "1", features = ["v4"] }
